<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="temas.css?v=20261010t">
    <link rel="stylesheet" href="papiro.css?v=20261010c">
    <link rel="stylesheet" href="componentes.css?v=20261010h">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro para Atendimento Astrológico</title>
  
  <!-- FONTES DO SOFTWARE (Cinzel e Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="publico-tema.js?v=20261011b"></script>
  
  <link rel="stylesheet" href="publico.css?v=20261010c">
</head>
<body>

<div class="form-card painel">
  <div id="formLogoContainer" style="text-align: center; margin-bottom: 20px;">
    <img id="formLogoImg" src="" alt="Logo" style="max-height: 75px; max-width: 100%; display: none; margin: 0 auto;" />
  </div>
  <h2 id="formTitulo">Dados para Atendimento</h2>
  <p id="formAviso" style="display:none; text-align:center; font-size:13px; margin:-8px 0 16px 0;"></p>
  <form id="clientForm" onsubmit="event.preventDefault(); abrirConfirmacao();">
    <div class="form-group">
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" required placeholder="Seu nome completo">
    </div>

    <div class="row">
      <div class="form-group">
        <label for="data">Data de Nascimento</label>
        <input type="text" id="data" required placeholder="DD/MM/AAAA">
      </div>
      <div class="form-group">
        <label for="hora">Horário</label>
        <input type="text" id="hora" placeholder="Ex: 14:30">
      </div>
    </div>

    <div class="form-group">
      <label for="cidade">Cidade / Estado de Nascimento</label>
      <input type="text" id="cidade" required placeholder="Digite a cidade..." autocomplete="off" oninput="pesquisarCidade(this.value)">
      <div id="cityResultsList" class="city-results"></div>
    </div>

    <div class="form-group" id="grupoWhatsapp">
      <label for="whatsapp">WhatsApp</label>
      <input type="tel" inputmode="tel" id="whatsapp" required placeholder="(11) 99999-9999">
    </div>

    <div class="form-group" id="grupoEmail">
      <label for="email">E-mail</label>
      <input type="email" id="email" required placeholder="seu@email.com">
    </div>

    <button type="submit" class="btn-submit" id="btnSubmitForm">Enviar Informações</button>
    <button type="button" class="btn-secondary" id="btnVoltarA" style="display:none; width:100%; margin-top:10px;" onclick="voltarParaEtapaA()">Voltar para os meus dados</button>
  </form>
</div>

<div class="form-powered-by">powered by Astro Hellenic</div>

<!-- MODAL DE CONFIRMAÇÃO DADOS -->
<div id="confirmModal" class="modal-overlay">
  <div class="modal-card janela" id="confirmModalCard"><div class="janela-corpo">
    <div id="confirmStepDados">
      <h3 id="confirmTitulo">Confirme seus dados</h3>
      <div id="sumTituloA" style="display:none; font-weight:700; font-size:12px; text-transform:uppercase; margin:0 0 6px 0;">Você (A)</div>
      <div class="summary-list">
        <div class="summary-item"><strong>Nome:</strong> <span id="sumNome"></span></div>
        <div class="summary-item"><strong>Data e Horário:</strong> <span id="sumDataHora"></span></div>
        <div class="summary-item"><strong>Cidade:</strong> <span id="sumCidade"></span></div>
        <div class="summary-item"><strong>WhatsApp:</strong> <span id="sumWhatsapp"></span></div>
        <div class="summary-item"><strong>E-mail:</strong> <span id="sumEmail"></span></div>
      </div>
      <div id="sumBlocoB" style="display:none;">
        <div style="font-weight:700; font-size:12px; text-transform:uppercase; margin:0 0 6px 0;">Pessoa analisada junto (B)</div>
        <div class="summary-list">
          <div class="summary-item"><strong>Nome:</strong> <span id="sumNomeB"></span></div>
          <div class="summary-item"><strong>Data e Horário:</strong> <span id="sumDataHoraB"></span></div>
          <div class="summary-item"><strong>Cidade:</strong> <span id="sumCidadeB"></span></div>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="fecharConfirmacao()">Corrigir</button>
        <button type="button" class="btn-primary" id="btnFinalSubmit" onclick="enviarParaSupabase()">Confirmar e Enviar</button>
      </div>
    </div>
    <div id="confirmStepSucesso" style="display: none; text-align: center;">
      <h3>Dados enviados com sucesso!</h3>
      <p id="sucessoMensagem" style="font-size: 13px; color: var(--text-main); margin-bottom: 24px; line-height: 1.6;">
        Recebemos suas informações. Redirecionando...
      </p>
    </div>
  </div></div>
</div>

<script>
  const SUPABASE_URL = "https://ndgjenvddkmztmdixjhc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VTjldgs8Hv1RODaMg7T57Q_ISzbnm5C";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let redirectUrlForm = null;
  let abrirAgendaConfig = false;

  /* CARREGA O LOGO PERSONALIZADO AO ABRIR A PÁGINA */
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('u');

      /* Só logo e redirecionamento — o webhook e o resto das configurações nunca saem do servidor. */
      const { data: cfgPublica } = await supabaseClient.rpc('config_publica_formulario', { p_user: userId });
      const data = Array.isArray(cfgPublica) ? cfgPublica[0] : cfgPublica;
      /* "abrir a agenda em seguida" (Configurações → Captação): vale pro link sem nada a mais; o &agenda=1 dos links antigos continua valendo */
      try { const { data: abre } = await supabaseClient.rpc('formulario_abre_agenda', { p_user: userId }); abrirAgendaConfig = abre === true; } catch (e) { /* sem a função, só vale o link */ }
      redirectUrlForm = data && data.redirect_url ? data.redirect_url : null;
      aplicarTemaPublico(data ? data.formulario_tema : null);

      if (data && data.logo_url) {
        const logoImg = document.getElementById('formLogoImg');
        if (logoImg) {
          logoImg.src = `${data.logo_url.split('?')[0]}?t=${Date.now()}`;
          logoImg.style.display = 'block';
        }
      }
    } catch (e) {
      console.error("Erro ao carregar logo:", e);
    }
  });

  const urlParams = new URLSearchParams(window.location.search);
  const ownerId = urlParams.get('u') || null;

  let selectedGeo = { lat: null, lon: null, name: '' };
  let citySearchTimeout = null;

  function pesquisarCidade(termo) {
    clearTimeout(citySearchTimeout);
    selectedGeo = { lat: null, lon: null, name: '' };
    const resultsList = document.getElementById('cityResultsList');
    if (!termo || termo.trim().length < 3) {
      resultsList.style.display = 'none';
      return;
    }

    citySearchTimeout = setTimeout(async () => {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(termo)}&limit=5&accept-language=pt-br`);
        const data = await response.json();

        if (data && data.length > 0) {
          resultsList.innerHTML = '';
          data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'city-item';
            div.innerText = item.display_name;
            div.onclick = () => selecionarCidade(item.display_name, item.lat, item.lon);
            resultsList.appendChild(div);
          });
          resultsList.style.display = 'block';
        } else {
          resultsList.style.display = 'none';
        }
      } catch (e) {
        resultsList.style.display = 'none';
      }
    }, 400);
  }

  function selecionarCidade(nomeExibicao, lat, lon) {
    document.getElementById('cidade').value = nomeExibicao;
    selectedGeo = { lat: parseFloat(lat), lon: parseFloat(lon), name: nomeExibicao };
    document.getElementById('cityResultsList').style.display = 'none';
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#cidade') && !e.target.closest('#cityResultsList')) {
      document.getElementById('cityResultsList').style.display = 'none';
    }
  });

  /* Data e hora chegam como texto livre; aqui viram o formato que o Astro Hellenic espera (DD/MM/AAAA e HH:MM).
     Aceita "6/3/1978", "06-03-1978", "10h45", "10:45" etc. Devolve null se for data/hora que não existe. */
  function normalizarData(txt) {
    const m = String(txt).trim().match(/^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{4})$/);
    if (!m) return null;
    const d = parseInt(m[1], 10), mes = parseInt(m[2], 10), a = parseInt(m[3], 10);
    const dt = new Date(a, mes - 1, d);
    if (a < 1850 || dt > new Date() || dt.getFullYear() !== a || dt.getMonth() !== mes - 1 || dt.getDate() !== d) return null;
    return String(d).padStart(2, '0') + '/' + String(mes).padStart(2, '0') + '/' + a;
  }
  function normalizarHora(txt) {
    const t = String(txt).trim().toLowerCase();
    if (!t) return '';
    const m = t.match(/^(\d{1,2})\s*(?::|h)\s*(\d{1,2})?\s*(?:min)?$/);
    if (!m) return null;
    const h = parseInt(m[1], 10), mi = m[2] ? parseInt(m[2], 10) : 0;
    if (h > 23 || mi > 59) return null;
    return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0');
  }

  /* SINASTRIA (link com &servico=sinastria): duas etapas — A (quem paga) e B (pessoa analisada junto).
     Os dois mapas só são gravados juntos, no fim. */
  const modoSinastria = /sinastria/i.test(new URLSearchParams(window.location.search).get('servico') || ''); /* qualquer serviço com "sinastria" no nome abre o formulário duplo */
  let etapaSinastria = 'A';
  let dadosA = null, dadosB = null;

  function aplicarEtapa(etapa) {
    etapaSinastria = etapa;
    if (!modoSinastria) return;
    const b = etapa === 'B';
    document.getElementById('formTitulo').innerText = b ? 'Sinastria: dados da outra pessoa' : 'Sinastria: seus dados';
    const aviso = document.getElementById('formAviso');
    aviso.innerText = b ? 'Informe os dados da pessoa que será analisada junto com você.' : '';
    aviso.style.display = b ? 'block' : 'none';
    document.getElementById('grupoWhatsapp').style.display = b ? 'none' : '';
    document.getElementById('grupoEmail').style.display = b ? 'none' : '';
    document.getElementById('whatsapp').required = !b;
    document.getElementById('email').required = !b;
    document.getElementById('btnSubmitForm').innerText = b ? 'Revisar e Enviar' : 'Continuar';
    document.getElementById('btnVoltarA').style.display = b ? 'block' : 'none';
  }

  function irParaEtapaB() {
    ['nome', 'data', 'hora', 'cidade'].forEach(id => { document.getElementById(id).value = ''; });
    selectedGeo = { lat: null, lon: null, name: '' };
    aplicarEtapa('B');
    window.scrollTo(0, 0);
  }

  function voltarParaEtapaA() {
    if (!dadosA) return;
    document.getElementById('nome').value = dadosA.nome;
    document.getElementById('data').value = dadosA.data;
    document.getElementById('hora').value = dadosA.hora;
    document.getElementById('cidade').value = dadosA.cidade;
    document.getElementById('whatsapp').value = dadosA.whatsapp;
    document.getElementById('email').value = dadosA.email;
    selectedGeo = { ...dadosA.geo };
    aplicarEtapa('A');
    window.scrollTo(0, 0);
  }

  document.addEventListener('DOMContentLoaded', () => { if (modoSinastria) aplicarEtapa('A'); });

  /* Valida os campos da etapa atual; devolve os dados já normalizados, ou null se algo estiver errado. */
  function lerEtapaAtual() {
    const precisaContato = !(modoSinastria && etapaSinastria === 'B');
    const nome = document.getElementById('nome').value.trim();
    const campoWhats = document.getElementById('whatsapp');
    const digitosWhats = campoWhats.value.replace(/\D/g, '');
    if (precisaContato && (/[^0-9\s()+.\-]/.test(campoWhats.value) || digitosWhats.length < 10 || digitosWhats.length > 15)) {
      alert('WhatsApp inválido. Digite só números, com DDD (ex.: (11) 99999-9999).'); campoWhats.focus(); return null;
    }
    const campoData = document.getElementById('data'), campoHora = document.getElementById('hora');
    const dataNorm = normalizarData(campoData.value);
    if (!dataNorm) { alert('Data de nascimento inválida. Use o formato DD/MM/AAAA (ex.: 06/03/1978).'); campoData.focus(); return null; }
    const horaNorm = normalizarHora(campoHora.value);
    if (horaNorm === null) { alert('Horário inválido. Use o formato HH:MM (ex.: 14:30), de 00:00 a 23:59.'); campoHora.focus(); return null; }
    campoData.value = dataNorm; campoHora.value = horaNorm;
    const cidadeInput = document.getElementById('cidade').value.trim();

    if (!selectedGeo.name || selectedGeo.name !== cidadeInput || !selectedGeo.lat || !selectedGeo.lon) {
      alert('Por favor, selecione a cidade clicando em uma das opções da lista sugerida.');
      return null;
    }
    return {
      nome, data: dataNorm, hora: horaNorm, cidade: selectedGeo.name, lat: selectedGeo.lat, lon: selectedGeo.lon,
      whatsapp: precisaContato ? campoWhats.value.trim() : '', email: precisaContato ? document.getElementById('email').value.trim() : '',
      geo: { ...selectedGeo }
    };
  }

  function abrirConfirmacao() {
    const d = lerEtapaAtual();
    if (!d) return;

    if (modoSinastria && etapaSinastria === 'A') { dadosA = d; irParaEtapaB(); return; }
    if (modoSinastria) dadosB = d;

    const a = modoSinastria ? dadosA : d;
    document.getElementById('sumNome').innerText = a.nome;
    document.getElementById('sumDataHora').innerText = `${a.data} às ${a.hora || 'Não informada'}`;
    document.getElementById('sumCidade').innerText = a.cidade;
    document.getElementById('sumWhatsapp').innerText = a.whatsapp;
    document.getElementById('sumEmail').innerText = a.email;

    if (modoSinastria) {
      document.getElementById('confirmTitulo').innerText = 'Confirme os dados dos dois mapas';
      document.getElementById('sumTituloA').style.display = 'block';
      document.getElementById('sumBlocoB').style.display = 'block';
      document.getElementById('sumNomeB').innerText = dadosB.nome;
      document.getElementById('sumDataHoraB').innerText = `${dadosB.data} às ${dadosB.hora || 'Não informada'}`;
      document.getElementById('sumCidadeB').innerText = dadosB.cidade;
    }

    document.getElementById('confirmModal').style.display = 'flex';
  }

  function fecharConfirmacao() {
    document.getElementById('confirmModal').style.display = 'none';
    document.getElementById('confirmStepDados').style.display = 'block';
    document.getElementById('confirmStepSucesso').style.display = 'none';
  }

  async function enviarParaSupabase() {
    const btn = document.getElementById('btnFinalSubmit');
    btn.disabled = true;
    btn.innerText = 'Enviando...';

    const payload = {
      pasta: 'Clientes',
      tipo: 'Natal',
      nome: document.getElementById('nome').value.trim(),
      data_nascimento: document.getElementById('data').value.trim(),
      hora_nascimento: document.getElementById('hora').value.trim(),
      cidade: selectedGeo.name,
      latitude: selectedGeo.lat,
      longitude: selectedGeo.lon,
      whatsapp: document.getElementById('whatsapp').value.trim(),
      email: document.getElementById('email').value.trim(),
      user_id: ownerId
    };

    try {
      /* O servidor grava o mapa E dispara o webhook (o endereço do webhook não passa mais pelo navegador). */
      /* Sinastria: grava A e B juntos (código 0157 A / 0157 B, calculado no servidor). Devolve o id do A. */
      const resposta = modoSinastria
        ? await supabaseClient.rpc('registrar_par_sinastria', {
            p_user: ownerId,
            p_nome_a: dadosA.nome, p_data_a: dadosA.data, p_hora_a: dadosA.hora, p_cidade_a: dadosA.cidade, p_lat_a: dadosA.lat, p_lon_a: dadosA.lon,
            p_whatsapp: dadosA.whatsapp, p_email: dadosA.email,
            p_nome_b: dadosB.nome, p_data_b: dadosB.data, p_hora_b: dadosB.hora, p_cidade_b: dadosB.cidade, p_lat_b: dadosB.lat, p_lon_b: dadosB.lon
          })
        : await supabaseClient.rpc('registrar_cliente_formulario', {
            p_user: payload.user_id, p_nome: payload.nome, p_data: payload.data_nascimento, p_hora: payload.hora_nascimento,
            p_cidade: payload.cidade, p_lat: payload.latitude, p_lon: payload.longitude,
            p_whatsapp: payload.whatsapp, p_email: payload.email
          });
      const { data: novoClienteId, error } = resposta;
      if (!error) {
        /* {USER} e {CLIENTE} no link de redirecionamento viram o id do astrólogo e do cliente recém-cadastrado (página de agendar) */
        /* link com &agenda=1 (caixinha em Configurações → Captação): depois do envio abre a agenda do astrólogo, no lugar do redirecionamento */
        const abrirAgenda = (abrirAgendaConfig || new URLSearchParams(window.location.search).get('agenda') === '1') && ownerId && novoClienteId;
        const servicoLink = (new URLSearchParams(window.location.search).get('servico') || '').slice(0, 120); /* nome do serviço (&servico=...) segue até a agenda, que o entrega como {SERVICO} */
        const destinoForm = abrirAgenda ? 'https://astrohellenic.com/agendar.html?u={USER}&c={CLIENTE}' + (servicoLink ? '&s=' + encodeURIComponent(servicoLink) : '') : redirectUrlForm; /* o redirecionamento do astrólogo é aberto pela própria agenda, depois da escolha do horário */
        const cfgData = { redirect_url: destinoForm ? destinoForm.replace(/\{USER\}/g, encodeURIComponent(ownerId || '')).replace(/\{CLIENTE\}/g, encodeURIComponent(novoClienteId || '')) : null };

        /* sem agenda: o webhook do astrólogo (se houver) é avisado agora, com os dados do formulário (com agenda, quem avisa é a agenda, depois do horário) */
        if (!abrirAgenda && ownerId && novoClienteId) {
          try { await Promise.race([fetch('https://astrohellenicgithubio.vercel.app/api/agenda-google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ acao: 'avisar', u: ownerId, c: novoClienteId, semAgenda: true, servico: servicoLink }) }), new Promise(r => setTimeout(r, 4000))]); } catch (e) { /* o cadastro já está salvo */ }
        }

        /* agenda em seguida: vai direto, sem a caixa de "redirecionando" */
        if (abrirAgenda && cfgData.redirect_url) { window.location.replace(cfgData.redirect_url); return; }

        document.getElementById('clientForm').reset();
        selectedGeo = { lat: null, lon: null, name: '' };
        if (modoSinastria) { dadosA = null; dadosB = null; aplicarEtapa('A'); }

        document.getElementById('confirmStepDados').style.display = 'none';
        document.getElementById('confirmStepSucesso').style.display = 'block';

        if (cfgData && cfgData.redirect_url) {
          window.location.replace(cfgData.redirect_url);
          return;
        } else {
          document.getElementById('sucessoMensagem').innerText = 'Recebemos suas informações. Em breve entraremos em contato.';
          setTimeout(() => {
            fecharConfirmacao();
          }, 2500);
        }

      } else {
        alert('Erro ao enviar dados: ' + error.message);
      }

    } catch (err) {
      alert('Erro de conexão ao enviar formulário.');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Confirmar e Enviar';
    }
  }
</script>
</body>
</html>
