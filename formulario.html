<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro para Atendimento Astrológico</title>
  
  <!-- FONTES DO SOFTWARE (Cinzel e Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-main: #fffdf5;
      --card-bg: #ffffff;
      --primary-blue: #103b70;
      --gold: #c59b27;
      --gold-hover: #a8821e;
      --border-color: #e2d9c2;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      gap: 16px;
    }

    /* Igual ao rodapé da capa dos relatórios (ver .rel-powered-by em relatorio.js) */
    .form-powered-by {
      font-size: 9px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .form-card { 
      background: var(--card-bg); 
      padding: 32px 28px; 
      border-radius: 14px; 
      box-shadow: 0 4px 20px rgba(197, 155, 39, 0.08); 
      width: 100%; 
      max-width: 440px; 
      border: 1.5px solid var(--gold); 
      position: relative; 
    }

    h2 { 
      margin: 0 0 24px 0; 
      font-family: 'Cinzel', serif;
      font-size: 20px; 
      font-weight: 700;
      color: var(--primary-blue); 
      text-align: center; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group { 
      margin-bottom: 16px; 
      position: relative; 
    }

    label { 
      display: block; 
      font-size: 11px; 
      font-weight: 700; 
      color: var(--primary-blue); 
      margin-bottom: 6px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
    }

    input { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      font-size: 14px; 
      font-family: 'Montserrat', sans-serif;
      background: #ffffff;
      color: var(--text-main);
      outline: none; 
      transition: all 0.2s ease;
    }

    input:focus { 
      border-color: var(--gold); 
      box-shadow: 0 0 0 3px rgba(197, 155, 39, 0.15);
    }

    .row { 
      display: flex; 
      gap: 12px; 
    }

    .row .form-group { 
      flex: 1; 
    }

    .btn-submit { 
      width: 100%; 
      background: var(--primary-blue); 
      color: #fcf6ba; 
      border: 1px solid var(--gold); 
      padding: 14px; 
      border-radius: 8px; 
      font-family: 'Cinzel', serif;
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: 12px; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(16, 59, 112, 0.15);
    }

    .btn-submit:hover {
      background: #0d2f5a;
      border-color: #fcf6ba;
    }

    /* Autocomplete de Cidade */
    .city-results { 
      position: absolute; 
      top: 100%; 
      left: 0; 
      right: 0; 
      background: #ffffff; 
      border: 1px solid var(--gold); 
      border-radius: 8px; 
      max-height: 180px; 
      overflow-y: auto; 
      z-index: 1000; 
      box-shadow: 0 6px 16px rgba(0,0,0,0.12); 
      display: none; 
      margin-top: 4px;
    }

    .city-item { 
      padding: 10px 12px; 
      font-size: 13px; 
      border-bottom: 1px solid #f1f5f9; 
      cursor: pointer; 
      color: var(--text-main);
    }

    .city-item:hover { 
      background: var(--bg-main); 
      color: var(--primary-blue); 
      font-weight: 600;
    }

    /* Modal de Confirmação */
    .modal-overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      background: rgba(16, 59, 112, 0.5); 
      backdrop-filter: blur(2px);
      display: none; 
      justify-content: center; 
      align-items: center; 
      z-index: 9999; 
      padding: 20px; 
    }

    .modal-card { 
      background: var(--card-bg); 
      padding: 28px; 
      border-radius: 14px; 
      width: 100%; 
      max-width: 420px; 
      border: 1.5px solid var(--gold);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
    }

    .modal-card h3 { 
      margin: 0 0 20px 0; 
      font-family: 'Cinzel', serif;
      color: var(--primary-blue); 
      font-size: 17px; 
      font-weight: 700;
      text-align: center; 
      text-transform: uppercase;
    }

    .summary-list { 
      font-size: 13px; 
      color: var(--text-main); 
      margin-bottom: 24px; 
      line-height: 1.6; 
    }

    .summary-item { 
      margin-bottom: 10px; 
      border-bottom: 1px solid #f1f5f9; 
      padding-bottom: 6px; 
    }

    .summary-item strong { 
      color: var(--primary-blue); 
      font-size: 11px; 
      text-transform: uppercase; 
      display: block; 
      letter-spacing: 0.5px;
    }

    .modal-actions { 
      display: flex; 
      gap: 12px; 
    }

    .btn-secondary { 
      flex: 1; 
      background: #ffffff; 
      color: var(--primary-blue); 
      border: 1px solid var(--border-color); 
      padding: 12px; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 13px;
      cursor: pointer; 
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--bg-main);
      border-color: var(--gold);
    }

    .btn-primary { 
      flex: 1; 
      background: var(--primary-blue); 
      color: #fcf6ba; 
      border: 1px solid var(--gold); 
      padding: 12px; 
      border-radius: 8px; 
      font-family: 'Cinzel', serif;
      font-weight: 700; 
      font-size: 13px;
      cursor: pointer; 
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: #0d2f5a;
    }

    /* TEMA CÉU (opcional, escolhido nas configurações de captação): céu à noite atrás, papiro e tinta na frente. */
    body.tema-ceu {
      background-color: #070d25;
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(40, 80, 160, 0.45) 0%, transparent 60%),
        radial-gradient(1.2px 1.2px at 12% 18%, #dfe8ff 50%, transparent 51%),
        radial-gradient(1.6px 1.6px at 78% 12%, #f6e7b4 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 34% 62%, #ffffff 50%, transparent 51%),
        radial-gradient(1.4px 1.4px at 88% 70%, #dfe8ff 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 6% 84%, #f6e7b4 50%, transparent 51%),
        radial-gradient(1.6px 1.6px at 56% 90%, #ffffff 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 66% 40%, #dfe8ff 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 22% 38%, #ffffff 50%, transparent 51%);
      background-attachment: fixed;
    }
    body.tema-ceu .form-powered-by { color: #9fb0d8; }
    body.tema-ceu .form-card, body.tema-ceu .modal-card {
      border: none; box-shadow: none; color: #1a1410;
      background:
        radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(80,48,20,0.25) 100%),
        radial-gradient(ellipse at 12% 8%, rgba(240,222,180,0.5) 0%, transparent 45%),
        repeating-linear-gradient(0deg, rgba(95,65,30,0.10) 0px, rgba(95,65,30,0.10) 1px, transparent 1px, transparent 5px),
        repeating-linear-gradient(90deg, rgba(110,78,40,0.07) 0px, rgba(110,78,40,0.07) 2px, transparent 2px, transparent 25px),
        linear-gradient(180deg, #d6bd92 0%, #c8a878 55%, #b98f5f 100%);
      clip-path: polygon(0 4px, 6% 0, 15% 3px, 27% 0, 38% 4px, 50% 1px, 63% 4px, 75% 0, 88% 3px, 95% 0, 100% 4px, calc(100% - 3px) 12%, 100% 30%, calc(100% - 4px) 52%, 100% 74%, calc(100% - 3px) 90%, 100% calc(100% - 4px), 93% calc(100% - 1px), 82% 100%, 70% calc(100% - 4px), 57% calc(100% - 1px), 45% 100%, 33% calc(100% - 4px), 20% calc(100% - 1px), 9% 100%, 0 calc(100% - 4px), 4px 85%, 0 62%, 3px 40%, 0 18%);
    }
    body.tema-ceu h2, body.tema-ceu .modal-card h3, body.tema-ceu label, body.tema-ceu .summary-item strong { color: #1d3a66; }
    body.tema-ceu input { background: transparent; border: 1.5px solid #1d3a66; color: #1a1410; border-radius: 6px; }
    body.tema-ceu input::placeholder { color: rgba(26, 20, 16, 0.5); }
    body.tema-ceu input:focus { border-color: #a03e25; box-shadow: none; }
    body.tema-ceu .btn-submit, body.tema-ceu .btn-primary {
      background: transparent; color: #a03e25; border: 1.5px solid #a03e25; box-shadow: none;
    }
    body.tema-ceu .btn-submit:hover, body.tema-ceu .btn-primary:hover { background: rgba(160, 62, 37, 0.12); border-color: #a03e25; }
    body.tema-ceu .btn-secondary { background: transparent; color: #1d3a66; border: 1.5px solid #1d3a66; }
    body.tema-ceu .btn-secondary:hover { background: rgba(29, 58, 102, 0.1); border-color: #1d3a66; }
    body.tema-ceu .summary-list, body.tema-ceu .summary-item { color: #1a1410; border-color: rgba(95, 65, 30, 0.4); }
    body.tema-ceu .modal-overlay { background: rgba(7, 13, 37, 0.7); }
    body.tema-ceu .city-results { background: #e3cfa6; border: 1.5px solid #1d3a66; }
    body.tema-ceu .city-item { color: #1a1410; border-color: rgba(95, 65, 30, 0.3); }
    body.tema-ceu .city-item:hover { background: rgba(29, 58, 102, 0.12); color: #1d3a66; }
  </style>
</head>
<body>

<div class="form-card">
  <div id="formLogoContainer" style="text-align: center; margin-bottom: 20px;">
    <img id="formLogoImg" src="" alt="Logo" style="max-height: 75px; max-width: 100%; display: none; margin: 0 auto;" />
  </div>
  <h2>Dados para Atendimento</h2>
  <form id="clientForm" onsubmit="event.preventDefault(); abrirConfirmacao();">
    <div class="form-group">
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" required placeholder="Seu nome completo">
    </div>

    <div class="row">
      <div class="form-group">
        <label for="data">Data de Nascimento</label>
        <input type="text" id="data" required placeholder="DD/MM/AAAA">
      </div>
      <div class="form-group">
        <label for="hora">Horário</label>
        <input type="text" id="hora" placeholder="Ex: 14:30">
      </div>
    </div>

    <div class="form-group">
      <label for="cidade">Cidade / Estado de Nascimento</label>
      <input type="text" id="cidade" required placeholder="Digite a cidade..." autocomplete="off" oninput="pesquisarCidade(this.value)">
      <div id="cityResultsList" class="city-results"></div>
    </div>

    <div class="form-group">
      <label for="whatsapp">WhatsApp</label>
      <input type="tel" inputmode="tel" id="whatsapp" required placeholder="(11) 99999-9999">
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" required placeholder="seu@email.com">
    </div>

    <button type="submit" class="btn-submit">Enviar Informações</button>
  </form>
</div>

<div class="form-powered-by">powered by Astro Hellenic</div>

<!-- MODAL DE CONFIRMAÇÃO DADOS -->
<div id="confirmModal" class="modal-overlay">
  <div class="modal-card" id="confirmModalCard">
    <div id="confirmStepDados">
      <h3>Confirme seus dados</h3>
      <div class="summary-list">
        <div class="summary-item"><strong>Nome:</strong> <span id="sumNome"></span></div>
        <div class="summary-item"><strong>Data e Horário:</strong> <span id="sumDataHora"></span></div>
        <div class="summary-item"><strong>Cidade:</strong> <span id="sumCidade"></span></div>
        <div class="summary-item"><strong>WhatsApp:</strong> <span id="sumWhatsapp"></span></div>
        <div class="summary-item"><strong>E-mail:</strong> <span id="sumEmail"></span></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" onclick="fecharConfirmacao()">Corrigir</button>
        <button type="button" class="btn-primary" id="btnFinalSubmit" onclick="enviarParaSupabase()">Confirmar e Enviar</button>
      </div>
    </div>
    <div id="confirmStepSucesso" style="display: none; text-align: center;">
      <h3>Dados enviados com sucesso!</h3>
      <p id="sucessoMensagem" style="font-size: 13px; color: var(--text-main); margin-bottom: 24px; line-height: 1.6;">
        Recebemos suas informações. Redirecionando...
      </p>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://ndgjenvddkmztmdixjhc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VTjldgs8Hv1RODaMg7T57Q_ISzbnm5C";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let redirectUrlForm = null;

  /* CARREGA O LOGO PERSONALIZADO AO ABRIR A PÁGINA */
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('u');

      /* Só logo e redirecionamento — o webhook e o resto das configurações nunca saem do servidor. */
      const { data: cfgPublica } = await supabaseClient.rpc('config_publica_formulario', { p_user: userId });
      const data = Array.isArray(cfgPublica) ? cfgPublica[0] : cfgPublica;
      redirectUrlForm = data && data.redirect_url ? data.redirect_url : null;
      if (data && data.formulario_tema === 'ceu') document.body.classList.add('tema-ceu');

      if (data && data.logo_url) {
        const logoImg = document.getElementById('formLogoImg');
        if (logoImg) {
          logoImg.src = `${data.logo_url.split('?')[0]}?t=${Date.now()}`;
          logoImg.style.display = 'block';
        }
      }
    } catch (e) {
      console.error("Erro ao carregar logo:", e);
    }
  });

  const urlParams = new URLSearchParams(window.location.search);
  const ownerId = urlParams.get('u') || null;

  let selectedGeo = { lat: null, lon: null, name: '' };
  let citySearchTimeout = null;

  function pesquisarCidade(termo) {
    clearTimeout(citySearchTimeout);
    selectedGeo = { lat: null, lon: null, name: '' };
    const resultsList = document.getElementById('cityResultsList');
    if (!termo || termo.trim().length < 3) {
      resultsList.style.display = 'none';
      return;
    }

    citySearchTimeout = setTimeout(async () => {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(termo)}&limit=5&accept-language=pt-br`);
        const data = await response.json();

        if (data && data.length > 0) {
          resultsList.innerHTML = '';
          data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'city-item';
            div.innerText = item.display_name;
            div.onclick = () => selecionarCidade(item.display_name, item.lat, item.lon);
            resultsList.appendChild(div);
          });
          resultsList.style.display = 'block';
        } else {
          resultsList.style.display = 'none';
        }
      } catch (e) {
        resultsList.style.display = 'none';
      }
    }, 400);
  }

  function selecionarCidade(nomeExibicao, lat, lon) {
    document.getElementById('cidade').value = nomeExibicao;
    selectedGeo = { lat: parseFloat(lat), lon: parseFloat(lon), name: nomeExibicao };
    document.getElementById('cityResultsList').style.display = 'none';
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#cidade') && !e.target.closest('#cityResultsList')) {
      document.getElementById('cityResultsList').style.display = 'none';
    }
  });

  /* Data e hora chegam como texto livre; aqui viram o formato que o Astro Hellenic espera (DD/MM/AAAA e HH:MM).
     Aceita "6/3/1978", "06-03-1978", "10h45", "10:45" etc. Devolve null se for data/hora que não existe. */
  function normalizarData(txt) {
    const m = String(txt).trim().match(/^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{4})$/);
    if (!m) return null;
    const d = parseInt(m[1], 10), mes = parseInt(m[2], 10), a = parseInt(m[3], 10);
    const dt = new Date(a, mes - 1, d);
    if (a < 1850 || dt > new Date() || dt.getFullYear() !== a || dt.getMonth() !== mes - 1 || dt.getDate() !== d) return null;
    return String(d).padStart(2, '0') + '/' + String(mes).padStart(2, '0') + '/' + a;
  }
  function normalizarHora(txt) {
    const t = String(txt).trim().toLowerCase();
    if (!t) return '';
    const m = t.match(/^(\d{1,2})\s*(?::|h)\s*(\d{1,2})?\s*(?:min)?$/);
    if (!m) return null;
    const h = parseInt(m[1], 10), mi = m[2] ? parseInt(m[2], 10) : 0;
    if (h > 23 || mi > 59) return null;
    return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0');
  }

  function abrirConfirmacao() {
    const nome = document.getElementById('nome').value.trim();
    const campoWhats = document.getElementById('whatsapp');
    const digitosWhats = campoWhats.value.replace(/\D/g, '');
    if (/[^0-9\s()+.\-]/.test(campoWhats.value) || digitosWhats.length < 10 || digitosWhats.length > 15) {
      alert('WhatsApp inválido. Digite só números, com DDD (ex.: (11) 99999-9999).'); campoWhats.focus(); return;
    }
    const campoData = document.getElementById('data'), campoHora = document.getElementById('hora');
    const dataNorm = normalizarData(campoData.value);
    if (!dataNorm) { alert('Data de nascimento inválida. Use o formato DD/MM/AAAA (ex.: 06/03/1978).'); campoData.focus(); return; }
    const horaNorm = normalizarHora(campoHora.value);
    if (horaNorm === null) { alert('Horário inválido. Use o formato HH:MM (ex.: 14:30), de 00:00 a 23:59.'); campoHora.focus(); return; }
    campoData.value = dataNorm; campoHora.value = horaNorm;
    const data = dataNorm;
    const hora = horaNorm || 'Não informada';
    const cidadeInput = document.getElementById('cidade').value.trim();
    const whatsapp = document.getElementById('whatsapp').value.trim();
    const email = document.getElementById('email').value.trim();

    if (!selectedGeo.name || selectedGeo.name !== cidadeInput || !selectedGeo.lat || !selectedGeo.lon) {
      alert('Por favor, selecione a cidade clicando em uma das opções da lista sugerida.');
      return;
    }

    document.getElementById('sumNome').innerText = nome;
    document.getElementById('sumDataHora').innerText = `${data} às ${hora}`;
    document.getElementById('sumCidade').innerText = selectedGeo.name;
    document.getElementById('sumWhatsapp').innerText = whatsapp;
    document.getElementById('sumEmail').innerText = email;

    document.getElementById('confirmModal').style.display = 'flex';
  }

  function fecharConfirmacao() {
    document.getElementById('confirmModal').style.display = 'none';
    document.getElementById('confirmStepDados').style.display = 'block';
    document.getElementById('confirmStepSucesso').style.display = 'none';
  }

  async function enviarParaSupabase() {
    const btn = document.getElementById('btnFinalSubmit');
    btn.disabled = true;
    btn.innerText = 'Enviando...';

    const payload = {
      pasta: 'Clientes',
      tipo: 'Natal',
      nome: document.getElementById('nome').value.trim(),
      data_nascimento: document.getElementById('data').value.trim(),
      hora_nascimento: document.getElementById('hora').value.trim(),
      cidade: selectedGeo.name,
      latitude: selectedGeo.lat,
      longitude: selectedGeo.lon,
      whatsapp: document.getElementById('whatsapp').value.trim(),
      email: document.getElementById('email').value.trim(),
      user_id: ownerId
    };

    try {
      /* O servidor grava o mapa E dispara o webhook (o endereço do webhook não passa mais pelo navegador). */
      const { data: novoClienteId, error } = await supabaseClient.rpc('registrar_cliente_formulario', {
        p_user: payload.user_id, p_nome: payload.nome, p_data: payload.data_nascimento, p_hora: payload.hora_nascimento,
        p_cidade: payload.cidade, p_lat: payload.latitude, p_lon: payload.longitude,
        p_whatsapp: payload.whatsapp, p_email: payload.email
      });
      if (!error) {
        /* {USER} e {CLIENTE} no link de redirecionamento viram o id do astrólogo e do cliente recém-cadastrado (página de agendar) */
        const cfgData = { redirect_url: redirectUrlForm ? redirectUrlForm.replace(/\{USER\}/g, encodeURIComponent(ownerId || '')).replace(/\{CLIENTE\}/g, encodeURIComponent(novoClienteId || '')) : null };

        document.getElementById('clientForm').reset();
        selectedGeo = { lat: null, lon: null, name: '' };

        document.getElementById('confirmStepDados').style.display = 'none';
        document.getElementById('confirmStepSucesso').style.display = 'block';

        if (cfgData && cfgData.redirect_url) {
          document.getElementById('sucessoMensagem').innerText = 'Recebemos suas informações. Redirecionando...';
          setTimeout(() => {
            window.location.href = cfgData.redirect_url;
          }, 1800);
        } else {
          document.getElementById('sucessoMensagem').innerText = 'Recebemos suas informações. Em breve entraremos em contato.';
          setTimeout(() => {
            fecharConfirmacao();
          }, 2500);
        }

      } else {
        alert('Erro ao enviar dados: ' + error.message);
      }

    } catch (err) {
      alert('Erro de conexão ao enviar formulário.');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Confirmar e Enviar';
    }
  }
</script>
</body>
</html>
