<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro para Atendimento Astrológico</title>
  
  <!-- FONTES DO SOFTWARE (Cinzel e Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-main: #fffdf5;
      --card-bg: #ffffff;
      --primary-blue: #103b70;
      --gold: #c59b27;
      --gold-hover: #a8821e;
      --border-color: #e2d9c2;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body { 
      font-family: 'Montserrat', sans-serif; 
      background-color: var(--bg-main); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px; 
    }

    .form-card { 
      background: var(--card-bg); 
      padding: 32px 28px; 
      border-radius: 14px; 
      box-shadow: 0 4px 20px rgba(197, 155, 39, 0.08); 
      width: 100%; 
      max-width: 440px; 
      border: 1.5px solid var(--gold); 
      position: relative; 
    }

    h2 { 
      margin: 0 0 24px 0; 
      font-family: 'Cinzel', serif;
      font-size: 20px; 
      font-weight: 700;
      color: var(--primary-blue); 
      text-align: center; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group { 
      margin-bottom: 16px; 
      position: relative; 
    }

    label { 
      display: block; 
      font-size: 11px; 
      font-weight: 700; 
      color: var(--primary-blue); 
      margin-bottom: 6px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
    }

    input { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      font-size: 14px; 
      font-family: 'Montserrat', sans-serif;
      background: #ffffff;
      color: var(--text-main);
      outline: none; 
      transition: all 0.2s ease;
    }

    input:focus { 
      border-color: var(--gold); 
      box-shadow: 0 0 0 3px rgba(197, 155, 39, 0.15);
    }

    .row { 
      display: flex; 
      gap: 12px; 
    }

    .row .form-group { 
      flex: 1; 
    }

    .btn-submit { 
      width: 100%; 
      background: var(--primary-blue); 
      color: #fcf6ba; 
      border: 1px solid var(--gold); 
      padding: 14px; 
      border-radius: 8px; 
      font-family: 'Cinzel', serif;
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: 12px; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(16, 59, 112, 0.15);
    }

    .btn-submit:hover {
      background: #0d2f5a;
      border-color: #fcf6ba;
    }

    /* Autocomplete de Cidade */
    .city-results { 
      position: absolute; 
      top: 100%; 
      left: 0; 
      right: 0; 
      background: #ffffff; 
      border: 1px solid var(--gold); 
      border-radius: 8px; 
      max-height: 180px; 
      overflow-y: auto; 
      z-index: 1000; 
      box-shadow: 0 6px 16px rgba(0,0,0,0.12); 
      display: none; 
      margin-top: 4px;
    }

    .city-item { 
      padding: 10px 12px; 
      font-size: 13px; 
      border-bottom: 1px solid #f1f5f9; 
      cursor: pointer; 
      color: var(--text-main);
    }

    .city-item:hover { 
      background: var(--bg-main); 
      color: var(--primary-blue); 
      font-weight: 600;
    }

    /* Modal de Confirmação */
    .modal-overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      background: rgba(16, 59, 112, 0.5); 
      backdrop-filter: blur(2px);
      display: none; 
      justify-content: center; 
      align-items: center; 
      z-index: 9999; 
      padding: 20px; 
    }

    .modal-card { 
      background: var(--card-bg); 
      padding: 28px; 
      border-radius: 14px; 
      width: 100%; 
      max-width: 420px; 
      border: 1.5px solid var(--gold);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
    }

    .modal-card h3 { 
      margin: 0 0 20px 0; 
      font-family: 'Cinzel', serif;
      color: var(--primary-blue); 
      font-size: 17px; 
      font-weight: 700;
      text-align: center; 
      text-transform: uppercase;
    }

    .summary-list { 
      font-size: 13px; 
      color: var(--text-main); 
      margin-bottom: 24px; 
      line-height: 1.6; 
    }

    .summary-item { 
      margin-bottom: 10px; 
      border-bottom: 1px solid #f1f5f9; 
      padding-bottom: 6px; 
    }

    .summary-item strong { 
      color: var(--primary-blue); 
      font-size: 11px; 
      text-transform: uppercase; 
      display: block; 
      letter-spacing: 0.5px;
    }

    .modal-actions { 
      display: flex; 
      gap: 12px; 
    }

    .btn-secondary { 
      flex: 1; 
      background: #ffffff; 
      color: var(--primary-blue); 
      border: 1px solid var(--border-color); 
      padding: 12px; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 13px;
      cursor: pointer; 
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--bg-main);
      border-color: var(--gold);
    }

    .btn-primary { 
      flex: 1; 
      background: var(--primary-blue); 
      color: #fcf6ba; 
      border: 1px solid var(--gold); 
      padding: 12px; 
      border-radius: 8px; 
      font-family: 'Cinzel', serif;
      font-weight: 700; 
      font-size: 13px;
      cursor: pointer; 
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: #0d2f5a;
    }
  </style>
</head>
<body>

<div class="form-card">
  <div id="formLogoContainer" style="text-align: center; margin-bottom: 20px;">
    <img id="formLogoImg" src="" alt="Logo" style="max-height: 75px; max-width: 100%; display: none; margin: 0 auto;" />
  </div>
  <h2>Dados para Atendimento</h2>
  <form id="clientForm" onsubmit="event.preventDefault(); abrirConfirmacao();">
    <div class="form-group">
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" required placeholder="Seu nome completo">
    </div>

    <div class="row">
      <div class="form-group">
        <label for="data">Data de Nascimento</label>
        <input type="text" id="data" required placeholder="DD/MM/AAAA">
      </div>
      <div class="form-group">
        <label for="hora">Horário</label>
        <input type="text" id="hora" placeholder="Ex: 14:30">
      </div>
    </div>

    <div class="form-group">
      <label for="cidade">Cidade / Estado de Nascimento</label>
      <input type="text" id="cidade" required placeholder="Digite a cidade..." autocomplete="off" oninput="pesquisarCidade(this.value)">
      <div id="cityResultsList" class="city-results"></div>
    </div>

    <div class="form-group">
      <label for="whatsapp">WhatsApp</label>
      <input type="tel" id="whatsapp" required placeholder="(11) 99999-9999">
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" required placeholder="seu@email.com">
    </div>

    <button type="submit" class="btn-submit">Enviar Informações</button>
  </form>
</div>

<!-- MODAL DE CONFIRMAÇÃO DADOS -->
<div id="confirmModal" class="modal-overlay">
  <div class="modal-card">
    <h3>Confirme seus dados</h3>
    <div class="summary-list">
      <div class="summary-item"><strong>Nome:</strong> <span id="sumNome"></span></div>
      <div class="summary-item"><strong>Data e Horário:</strong> <span id="sumDataHora"></span></div>
      <div class="summary-item"><strong>Cidade:</strong> <span id="sumCidade"></span></div>
      <div class="summary-item"><strong>WhatsApp:</strong> <span id="sumWhatsapp"></span></div>
      <div class="summary-item"><strong>E-mail:</strong> <span id="sumEmail"></span></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="fecharConfirmacao()">Corrigir</button>
      <button type="button" class="btn-primary" id="btnFinalSubmit" onclick="enviarParaSupabase()">Confirmar e Enviar</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://ndgjenvddkmztmdixjhc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VTjldgs8Hv1RODaMg7T57Q_ISzbnm5C";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* CARREGA O LOGO PERSONALIZADO AO ABRIR A PÁGINA */
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('u');

      let query = supabaseClient.from('configuracoes').select('logo_url, redirect_url');
      if (userId) {
        query = query.eq('user_id', userId);
      }

      const { data } = await query.maybeSingle();

      if (data && data.logo_url) {
        const logoImg = document.getElementById('formLogoImg');
        if (logoImg) {
          logoImg.src = `${data.logo_url.split('?')[0]}?t=${Date.now()}`;
          logoImg.style.display = 'block';
        }
      }
    } catch (e) {
      console.error("Erro ao carregar logo:", e);
    }
  });

  const urlParams = new URLSearchParams(window.location.search);
  const ownerId = urlParams.get('u') || null;

  let selectedGeo = { lat: null, lon: null, name: '' };
  let citySearchTimeout = null;

  function pesquisarCidade(termo) {
    clearTimeout(citySearchTimeout);
    selectedGeo = { lat: null, lon: null, name: '' };
    const resultsList = document.getElementById('cityResultsList');
    if (!termo || termo.trim().length < 3) {
      resultsList.style.display = 'none';
      return;
    }

    citySearchTimeout = setTimeout(async () => {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(termo)}&limit=5&accept-language=pt-br`);
        const data = await response.json();

        if (data && data.length > 0) {
          resultsList.innerHTML = '';
          data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'city-item';
            div.innerText = item.display_name;
            div.onclick = () => selecionarCidade(item.display_name, item.lat, item.lon);
            resultsList.appendChild(div);
          });
          resultsList.style.display = 'block';
        } else {
          resultsList.style.display = 'none';
        }
      } catch (e) {
        resultsList.style.display = 'none';
      }
    }, 400);
  }

  function selecionarCidade(nomeExibicao, lat, lon) {
    document.getElementById('cidade').value = nomeExibicao;
    selectedGeo = { lat: parseFloat(lat), lon: parseFloat(lon), name: nomeExibicao };
    document.getElementById('cityResultsList').style.display = 'none';
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#cidade') && !e.target.closest('#cityResultsList')) {
      document.getElementById('cityResultsList').style.display = 'none';
    }
  });

  function abrirConfirmacao() {
    const nome = document.getElementById('nome').value.trim();
    const data = document.getElementById('data').value.trim();
    const hora = document.getElementById('hora').value.trim() || 'Não informada';
    const cidadeInput = document.getElementById('cidade').value.trim();
    const whatsapp = document.getElementById('whatsapp').value.trim();
    const email = document.getElementById('email').value.trim();

    if (!selectedGeo.name || selectedGeo.name !== cidadeInput || !selectedGeo.lat || !selectedGeo.lon) {
      alert('Por favor, selecione a cidade clicando em uma das opções da lista sugerida.');
      return;
    }

    document.getElementById('sumNome').innerText = nome;
    document.getElementById('sumDataHora').innerText = `${data} às ${hora}`;
    document.getElementById('sumCidade').innerText = selectedGeo.name;
    document.getElementById('sumWhatsapp').innerText = whatsapp;
    document.getElementById('sumEmail').innerText = email;

    document.getElementById('confirmModal').style.display = 'flex';
  }

  function fecharConfirmacao() {
    document.getElementById('confirmModal').style.display = 'none';
  }

  async function enviarParaSupabase() {
    const btn = document.getElementById('btnFinalSubmit');
    btn.disabled = true;
    btn.innerText = 'Enviando...';

    const payload = {
      pasta: 'Clientes',
      tipo: 'Natal',
      nome: document.getElementById('nome').value.trim(),
      data_nascimento: document.getElementById('data').value.trim(),
      hora_nascimento: document.getElementById('hora').value.trim(),
      cidade: selectedGeo.name,
      latitude: selectedGeo.lat,
      longitude: selectedGeo.lon,
      whatsapp: document.getElementById('whatsapp').value.trim(),
      email: document.getElementById('email').value.trim(),
      user_id: ownerId
    };

    try {
      const { error } = await supabaseClient.from('mapas').insert([payload]);
      if (!error) {
        let cfgData = null;
        try {
          let queryCfg = supabaseClient.from('configuracoes').select('*');
          if (ownerId) {
            queryCfg = queryCfg.eq('user_id', ownerId);
          }
          const { data } = await queryCfg.maybeSingle();
          cfgData = data;
        } catch (e) {
          console.error("Erro ao ler configuracoes:", e);
        }

        if (cfgData && cfgData.webhook_url) {
          try {
            await fetch(cfgData.webhook_url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                ...payload,
                data_envio: new Date().toISOString()
              })
            });
          } catch (webErr) {
            console.error("Erro no Webhook:", webErr);
          }
        }

        alert('Dados enviados com sucesso!');
        fecharConfirmacao();
        document.getElementById('clientForm').reset();
        selectedGeo = { lat: null, lon: null, name: '' };

        if (cfgData && cfgData.redirect_url) {
          window.location.href = cfgData.redirect_url;
        }

      } else {
        alert('Erro ao enviar dados: ' + error.message);
      }

    } catch (err) {
      alert('Erro de conexão ao enviar formulário.');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Confirmar e Enviar';
    }
  }
</script>
</body>
</html>
