    <!-- TEMA CÉU (claro/céu) — preferência do APARELHO (localStorage, chave astro_tema_mandala), igual ao modo de
         cor logo abaixo: o Céu hoje cobre o software inteiro, então é aparência, não dado da conta. Lido aqui, antes de
         qualquer coisa desenhar, pra abrir já no tema certo (sem mostrar o claro/escuro por trás e trocar depois);
         a classe "tema-ceu" entra no <body> logo na abertura dele (script logo depois de <body>). Ver CLAUDE.md. -->
    <script>
    (function() {
      var t = null;
      try { t = localStorage.getItem('astro_tema_mandala'); } catch (e) {}
      if (t === 'ceu' || t === 'claro') window.temaMandala = t;
    })();
    </script>

    <!-- MODO DE COR (CLARO/ESCURO/AUTOMÁTICO) — aplicado o mais cedo possível,
         antes do resto da página desenhar, pra não piscar claro e trocar pra
         escuro um instante depois. Preferência do NAVEGADOR (localStorage),
         não da conta — ver comentário maior sobre isso junto de
         ":root.tema-escuro" no <style> abaixo. window.aplicarModoCor fica
         exposta pra supabase.js reusar quando o astrólogo troca de opção
         na tela Configurações > Aparência. -->
    <script>
    (function() {
      var mediaEscuro = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
      var listenerAtivo = null;

      function calcularEscuro(modo) {
        if (window.temaMandala === 'ceu') return false; // o Céu é um tema independente: não tem base clara nem escura
        if (modo === 'escuro') return true;
        if (modo === 'claro') return false;
        return !!(mediaEscuro && mediaEscuro.matches);
      }

      function aplicarModoCor(modo) {
        document.documentElement.classList.toggle('tema-escuro', calcularEscuro(modo));
        if (!mediaEscuro) return;
        if (listenerAtivo) mediaEscuro.removeEventListener('change', listenerAtivo);
        listenerAtivo = null;
        if (modo === 'auto') {
          listenerAtivo = function(e) { document.documentElement.classList.toggle('tema-escuro', window.temaMandala !== 'ceu' && e.matches); };
          mediaEscuro.addEventListener('change', listenerAtivo);
        }
      }

      var modoSalvo = 'auto';
      try { modoSalvo = localStorage.getItem('astro_modo_cor') || 'auto'; } catch (e) {}
      aplicarModoCor(modoSalvo);
      window.aplicarModoCor = aplicarModoCor;

      /* Reaplica de novo no DOMContentLoaded (sempre antes do window.onload
         que desenha a mandala, em mandala.js) — cobre um bug conhecido do
         WebKit/Safari onde, numa carga fria da página, matchMedia
         ('prefers-color-scheme: dark') pode responder errado bem no
         início da navegação e só se corrigir um instante depois. Como o
         disco da mandala é desenhado uma vez só (vira um PNG fixo, não
         reage a CSS depois de pronto), se a classe "tema-escuro" estiver
         errada nesse instante inicial, o disco nasce com a cor errada
         mesmo que a classe se corrija logo em seguida — daí o sintoma
         "abre errado, só recarregando acerta". Só faz diferença quando
         modoSalvo é 'auto' (depende do sistema); em 'claro'/'escuro'
         fixos é a mesma leitura de sempre, sem custo. */
      document.addEventListener('DOMContentLoaded', function() { aplicarModoCor(modoSalvo); });
    })();
    </script>

/* Com o zoom por toque liberado (viewport sem user-scalable=no), o Safari/
   Chrome mobile passam a tratar todo toque como um possível início de duplo
   toque para zoom, atrasando o clique e podendo até cancelá-lo se o usuário
   tocar de novo antes do primeiro ser reconhecido. Em elementos clicáveis
   (todos usam onclick neste app) isso deixa acordeões/linhas de tabela sem
   responder no celular. "manipulation" mantém o pinça-para-zoom (usado para
   ver os SVGs ampliados) mas remove a ambiguidade de duplo toque só nesses
   elementos, sem alterar nada no desktop (mouse não é afetado por touch-action). */
[onclick] {
  touch-action: manipulation;
}

        /* BARRA SUPERIOR FIXA — posição e tamanho aqui; aparência (linhas duplas, cores) em componentes.css */
        #top-bar {
            height: 52px;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            gap: 8px;
            flex-shrink: 0;
            width: 100%;
            z-index: 10;
            margin-bottom: 10px;
            overflow: hidden;
        }

        /* Fora do modo Mandala/Radix (ver body.topbar-fixo, alternada em
           abrirModuloTecnica), o #top-bar vira de verdade position:fixed —
           assim dá pra trocar de ferramenta a qualquer momento, mesmo
           rolado bem fundo numa tela longa (ex.: o Relatório), sem
           precisar sair da tela atual pra enxergar os ícones. No modo
           Mandala ele continua no fluxo normal, de propósito: a mandala
           usa a altura de #main-stage como referência pra encolher (ver
           CLAUDE.md), e mexer nisso lá arriscaria quebrar esse cálculo. */
        body.topbar-fixo #top-bar {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            width: auto; /* #top-bar tem width:100% na regra base — sem isso, com left+right também setados, o width:100% "vence" e a barra transborda 10px pra fora da tela */
            z-index: 60;
            margin-bottom: 0;
        }

        /* Reserva o espaço que o #top-bar deixou de ocupar no fluxo normal
           ao virar fixed — a altura de verdade é medida em JS
           (ajustarEspacadorTopBar, em mandala.js), porque muda com o
           tamanho da tela. */
        #top-bar-espacador { display: none; }
        body.topbar-fixo #top-bar-espacador { display: block; margin-bottom: 10px; }

        .top-bar-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .top-bar-controls::-webkit-scrollbar {

        /* No celular, #mandala-controls-overlay (canto direito: ASC, Adicionar
           ao Relatório, zoom e stepper de tempo) ficou largo demais e passou
           a cobrir #mandala-actions-overlay (canto esquerdo: salvar, atualizar
           momento, Revolução Solar) — os dois têm o mesmo top:10px inline. O
           empurrão de #mandala-actions-overlay pra baixo de
           #mandala-controls-overlay NÃO é mais feito aqui em CSS (era um
           top:56px fixo, chutado pra quando o outro container sempre coubesse
           numa linha só) — agora que #mandala-controls-overlay pode quebrar
           em 1 ou 2 linhas (ver flex-wrap logo abaixo), 56px fixo ficaria
           errado num dos dois casos. Quem decide a posição certa agora é
           ajustarPosicaoMandalaActionsOverlay() (mandala.js), medindo a
           altura de verdade do outro container — mesmo padrão já usado no
           espaçador da barra fixa do editor de Relatório (medir em JS, não
           chutar em CSS, porque o tamanho muda com a largura da tela). */
        @media (max-width: 600px) {
            /* #mandala-controls-overlay só tinha right:10px (sem left), então
               numa tela estreita a fileira de botões (seletor de Casa 1 +
               "Adicionar ao Relatório" + zoom + stepper de tempo) ficava mais
               larga que a tela e o primeiro botão (o seletor de Casa 1)
               vazava pra fora da borda esquerda — e como #mandala-screen (o
               pai) tem overflow:hidden, esse pedaço simplesmente sumia
               cortado, em vez de aparecer ou rolar. Com left:10px também
               (largura travada entre as duas bordas, com 10px de respiro em
               cada uma) e flex-wrap, os botões que não cabem numa linha só
               descem pra uma segunda linha — nada fica cortado. !important
               pelo mesmo motivo do bloco acima: right/display são inline. */
            #mandala-controls-overlay {
                left: 10px !important;
                max-width: calc(100% - 20px);
                flex-wrap: wrap !important;
                justify-content: flex-end !important;
                row-gap: 6px;
            }
        }

        /* PALCO DA MANDALA: no tema "Céu", fundo roxo, continuação do
           espaço sideral desenhado dentro da própria mandala. Só se aplica
           com body.tema-ceu (o tema é por usuário, alternado em
           Configurações > Aparência); no tema "Claro" (padrão) fica sem
           fundo próprio, mostrando o branco de --bg-stage (#main-stage).
           Fica só aqui
           (não em #main-stage nem em body), então nunca aparece nas
           outras ferramentas — e a barra superior fixa, que tem fundo
           creme próprio, continua por cima sem ser afetada. */
        /* Tema Céu: o céu é o fundo do #main-stage inteiro (pintado por JS, ver
           configurarFundoCeuDaTela em mandala.js) — por isso a área da mandala fica sem fundo
           próprio e nada em volta (moldura, lados da barra) fica branco. */
        body.tema-ceu { background-color: #070d25; }
        /* o fundo do <html> também (senão, onde a página acaba ou no "puxão" do celular, aparece uma faixa creme do tema anterior embaixo do céu) */
        html:has(body.tema-ceu) { background-color: #070d25; }
        body.tema-ceu #main-stage { background-color: #070d25; }
        body.tema-ceu #mandala-screen {
            background-color: transparent;
        }

        /* TEMA CÉU: a barra superior é uma folha de papiro entre as duas linhas duplas (aparência em componentes.css). */

        /* TEMA CÉU: variáveis de papiro dos botões/janelinhas (usadas por outras telas). Os grupos de botões da mandala são barras (papiro.css). */
        body.tema-ceu {
            --papiro-botao: var(--papiro-fundo-simples);
            --papiro-botao-rasgo: polygon(
                0 2px, 14% 0, 32% 2px, 50% 0, 70% 2px, 88% 0, 100% 2px,
                calc(100% - 1px) 40%, 100% 70%, calc(100% - 2px) 100%,
                84% calc(100% - 2px), 62% 100%, 40% calc(100% - 2px), 18% 100%, 0 calc(100% - 2px),
                2px 65%, 0 35%);
        }

        /* TEMA CÉU: menu lateral como um rolo de papiro (borda direita rasgada). Só o papel e a borda; cores e linhas vêm de componentes.css. */
        body.tema-ceu #sidebar-overlay { background: rgba(5, 10, 32, 0.62); backdrop-filter: none; }

<!-- No iPad com trackpad/mouse, um único toque às vezes dispara dois eventos
     de clique bem próximos um do outro (ex.: abre e fecha o mesmo acordeão
     quase instantaneamente, parecendo que "não abre"). Isso não acontece com
     o dedo na tela. Este guarda ignora um segundo clique no MESMO elemento
     clicável (onclick, checkbox ou radio) que chegue muito rápido depois do
     primeiro, tratando-o como eco/fantasma do clique anterior. Não afeta
     cliques legítimos em elementos diferentes nem o visual em nada. -->
<script>
(function() {
  var lastClickEl = null;
  var lastClickTime = 0;
  document.addEventListener('click', function(e) {
    var el = e.target.closest('[onclick], input[type="checkbox"], input[type="radio"]');
    if (!el) { lastClickEl = null; return; }
    var now = Date.now();
    if (el === lastClickEl && (now - lastClickTime) < 350) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    lastClickEl = el;
    lastClickTime = now;
  }, true);
})();
</script>

<script>
  let isCadastroMode = false;

  /* MODOS DA TELA: 'entrar', 'cadastro', 'recuperar' (esqueci a senha: só o e-mail) e 'novaSenha' (depois de abrir o link do e-mail). */

  function aplicarModoAuth(modo) {
    modoAuth = modo;
    isCadastroMode = modo === 'cadastro';
    const el = id => document.getElementById(id);

      entrar:   { botao: 'Entrar',             link: 'Não tem uma conta? Criar nova conta', dica: '' },
      cadastro: { botao: 'Criar Conta',        link: 'Já tem uma conta? Fazer login',       dica: '' },
      recuperar:{ botao: 'Enviar link',        link: 'Voltar ao login',                     dica: 'Digite o e-mail da sua conta. Vamos enviar um link para você criar uma nova senha.' },
      novaSenha:{ botao: 'Salvar nova senha',  link: '',                                    dica: 'Escolha a nova senha (mínimo de 6 caracteres).' }
    }[modo];
    el('loginSubmitBtn').innerText = textos.botao;
    el('loginToggleMode').innerText = textos.link;
    mostrar('loginToggleMode', !!textos.link);
    mostrar('loginForgot', modo === 'entrar');
    mostrar('loginEmailBox', modo !== 'novaSenha');
    mostrar('loginPasswordBox', modo !== 'recuperar');
    mostrar('loginConfirmBox', modo === 'novaSenha');
    mostrar('loginOptionsBox', modo === 'entrar' || modo === 'cadastro');
    el('loginPassword').placeholder = modo === 'novaSenha' ? 'Nova senha' : 'Sua senha';
    if (dica) { dica.textContent = textos.dica; dica.style.display = textos.dica ? '' : 'none'; }
  }
  function alternarModoAuth() {
    // o link de baixo: entre "criar conta" e "entrar", ou "voltar ao login" quando está recuperando a senha
    aplicarModoAuth(modoAuth === 'entrar' ? 'cadastro' : 'entrar');
  }

  /* ESQUECI A SENHA: o Supabase manda um e-mail com um link; ao abrir o link o site volta aqui (PASSWORD_RECOVERY) e mostra
     a tela de nova senha. O endereço do site precisa estar nas "Redirect URLs" do Supabase (Authentication > URL Configuration). */
  async function enviarLinkRecuperacao() {
    const email = document.getElementById('loginEmail').value.trim();
    const erro = document.getElementById('loginErrorMsg');
    const client = window.supabaseClient || (typeof supabaseClient !== 'undefined' ? supabaseClient : null);
    const falha = msg => { erro.innerText = msg; erro.style.display = 'block'; };
    if (!email) { falha('Digite o seu e-mail.'); return; }
    if (!client) { falha('Erro: Conexão com o Supabase não foi iniciada.'); return; }
    const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) { falha('Não foi possível enviar o link: ' + error.message); return; }
    erro.style.display = 'none';
    const dica = document.getElementById('loginHint');
    dica.textContent = 'Pronto! Se esse e-mail tem uma conta, o link para criar a nova senha chegou na caixa de entrada (olhe também o spam).';
    dica.style.display = '';
  }

  async function salvarNovaSenhaLogin() {
    const nova = document.getElementById('loginPassword').value;
    const repete = document.getElementById('loginPasswordConfirm').value;
    const erro = document.getElementById('loginErrorMsg');
    const client = window.supabaseClient || (typeof supabaseClient !== 'undefined' ? supabaseClient : null);
    const falha = msg => { erro.innerText = msg; erro.style.display = 'block'; };
    if (!nova || nova.length < 6) { falha('A senha precisa ter pelo menos 6 caracteres.'); return; }
    if (nova !== repete) { falha('As duas senhas não são iguais.'); return; }
    if (!client) { falha('Erro: Conexão com o Supabase não foi iniciada.'); return; }
    const { error } = await client.auth.updateUser({ password: nova });
    if (error) { falha('Não foi possível salvar a nova senha: ' + error.message); return; }
    window.__recuperacaoSenha = false;
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    document.getElementById('loginPassword').value = ''; document.getElementById('loginPasswordConfirm').value = '';
    aplicarModoAuth('entrar');
    fecharTelaLogin();
    alert('Senha alterada. Você já está dentro.');
  }

  /* chegou pelo link do e-mail: mostra a tela de nova senha (a sessão de recuperação já foi aberta pelo Supabase) */
  function entrarModoNovaSenha() {
    mostrarTelaLogin();
    aplicarModoAuth('novaSenha');
  }

  async function fazerLogin(email, password) {
    const errorEl = document.getElementById('loginErrorMsg');
    const client = window.supabaseClient || (typeof supabaseClient !== 'undefined' ? supabaseClient : null);
    
    if (!client) {
      if (errorEl) {
        errorEl.innerText = "Erro: Conexão com o Supabase não foi iniciada.";
        errorEl.style.display = 'block';
      }
      return false;
    }

    const { data, error } = await client.auth.signInWithPassword({ email, password });
    if (error) {
      if (errorEl) {
        errorEl.innerText = "Erro ao entrar: " + error.message;
        errorEl.style.display = 'block';
      } else {
        alert("Erro ao entrar: " + error.message);
      }
      return false;
    }
    return true;
  }

  async function criarConta(email, password) {
    const errorEl = document.getElementById('loginErrorMsg');
    const client = window.supabaseClient || (typeof supabaseClient !== 'undefined' ? supabaseClient : null);
    
    if (!client) {
      if (errorEl) {
        errorEl.innerText = "Erro: Conexão com o Supabase não foi iniciada.";
        errorEl.style.display = 'block';
      }
      return false;
    }

    const { data, error } = await client.auth.signUp({ email, password });
    if (error) {
      if (errorEl) {
        errorEl.innerText = "Erro ao cadastrar: " + error.message;
        errorEl.style.display = 'block';
      } else {
        alert("Erro ao cadastrar: " + error.message);
      }
      return false;
    }
    alert("Conta criada com sucesso!");
    return true;
  }

  async function executarAcaoAuth() {
    if (modoAuth === 'recuperar') { await enviarLinkRecuperacao(); return; }
    if (modoAuth === 'novaSenha') { await salvarNovaSenhaLogin(); return; }
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value.trim();
    const errorEl = document.getElementById('loginErrorMsg');
    const keepLogged = document.getElementById('loginKeepLogged').checked;

    if (errorEl) errorEl.style.display = 'none';

    if (!email || !pass) {
      if (errorEl) {
        errorEl.innerText = 'Preencha o e-mail e a senha.';
        errorEl.style.display = 'block';
      }
      return;
    }

    localStorage.setItem('astro_keep_logged', keepLogged);

    try {
      const res = isCadastroMode ? await criarConta(email, pass) : await fazerLogin(email, pass);
      if (res) fecharTelaLogin();
    } catch (err) {
      if (errorEl) {
        errorEl.innerText = "Erro de execução: " + err.message;
        errorEl.style.display = 'block';
      }
    }
  }

  /* CÉU DO MOMENTO na tela de login — o mesmo céu da Mandala no Tema Céu (montarFundoCeuSVG, mandala.js):
     azul de dia, crepúsculo no nascer/pôr do Sol, noite estrelada. Sem mapa nem conta ainda, então a altura do
     Sol é aproximada: latitude padrão do Brasil e longitude pelo fuso do aparelho (tempo solar médio — dá a
     cor certa do céu, não precisa de precisão de minuto). */
  function calcularCeuDoMomentoLogin() {
    const rad = Math.PI / 180;
    const agora = new Date();
    const lat = -23.5 * rad;
    const lon = -agora.getTimezoneOffset() / 60 * 15; // graus, pelo fuso do aparelho
    const diaDoAno = (Date.UTC(agora.getUTCFullYear(), agora.getUTCMonth(), agora.getUTCDate()) - Date.UTC(agora.getUTCFullYear(), 0, 0)) / 86400000;
    const decl = -23.44 * rad * Math.cos(2 * Math.PI / 365 * (diaDoAno + 10));
    const horaUTC = agora.getUTCHours() + agora.getUTCMinutes() / 60;
    const anguloHorario = (horaUTC + lon / 15 - 12) * 15 * rad; // negativo de manhã, positivo à tarde
    const seno = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(anguloHorario);
    return { elevacao: Math.max(-1, Math.min(1, seno)), ladoSol: -Math.sin(anguloHorario) };
  }

  let _ceuLoginUrl = null;
  function renderizarCeuLogin() {
    const camada = document.getElementById('loginPlanetsDecor');
    if (!camada || typeof montarFundoCeuSVG !== 'function') return;
    const EXT = 1800, C = 1000;
    const { elevacao, ladoSol } = calcularCeuDoMomentoLogin();
    const svg = montarFundoCeuSVG({ cx: C, cy: C, width: 2 * C, height: 2 * C, termos: 110, raioCeu: 470, skyRotation: 0, elevacao, ladoSol, corDisco: 'none' }, EXT);
    if (_ceuLoginUrl) URL.revokeObjectURL(_ceuLoginUrl);
    _ceuLoginUrl = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
    // o horizonte (centro do desenho) fica a ~68% da altura da tela, no meio da largura
    const vw = window.innerWidth, vh = window.innerHeight;
    const escala = Math.max(1, Math.min(vw, vh) / 700);
    const lado = 2 * EXT * escala;
    camada.style.backgroundImage = `url("${_ceuLoginUrl}")`;
    camada.style.backgroundSize = `${lado}px ${lado}px`;
    camada.style.backgroundPosition = `${(vw / 2 - EXT * escala).toFixed(0)}px ${(vh * 0.68 - EXT * escala).toFixed(0)}px`;
    if (_mandalaLogin) posicionarMandalaLogin();
    else if (!_mandalaLoginPedida) {
      _mandalaLoginPedida = true;
      if (typeof gerarMandalaDoMomentoParaLogin === 'function') {
        gerarMandalaDoMomentoParaLogin().then(res => {
          if (!res) return; // sem rede etc.: fica só o céu
          _mandalaLogin = res;
          const overlay = document.getElementById('loginOverlay');
          if (overlay && overlay.classList.contains('visible')) posicionarMandalaLogin();
        });
      }
    }
  }

  /* A roda do momento (PNG transparente) com o céu enorme dela alinhado ao centro, igual à capa do Relatório. */
  let _mandalaLogin = null, _mandalaLoginPedida = false;
  function posicionarMandalaLogin() {
    const camada = document.getElementById('loginPlanetsDecor');
    const overlay = document.getElementById('loginOverlay');
    if (!camada || !overlay || !_mandalaLogin) return;
    const { png, ceu } = _mandalaLogin;
    const vw = window.innerWidth, vh = window.innerHeight;
    const retrato = vw / vh < 0.8;
    overlay.classList.toggle('login-retrato', retrato);
    const proporcao = ceu.width / ceu.height;
    const D = retrato ? Math.min(vw * 1.0, vh * 0.55 * proporcao) : Math.min(vw * 1.0, vh * proporcao);
    const topo = retrato ? vh * 0.03 : (vh - D / proporcao) / 2;
    let roda = document.getElementById('loginRoda');
    if (!roda) { roda = document.createElement('div'); roda.id = 'loginRoda'; camada.appendChild(roda); }
    roda.style.cssText = `position: absolute; left: ${((vw - D) / 2).toFixed(0)}px; top: ${topo.toFixed(0)}px; width: ${D.toFixed(0)}px; line-height: 0; isolation: isolate;`;
    const pct = v => (v * 100).toFixed(3) + '%';
    roda.innerHTML =
      `<img alt="" src="${ceu.url}" style="position: absolute; max-width: none; max-height: none; z-index: -1; left: ${pct((ceu.cx - ceu.ext) / ceu.width)}; top: ${pct((ceu.cy - ceu.ext) / ceu.height)}; width: ${pct(ceu.ext * 2 / ceu.width)}; height: ${pct(ceu.ext * 2 / ceu.height)};">` +
      // celular em pé: corta a faixa de papiro com o nome/data (fica embaixo da roda e vazaria ao lado do cartão)
      `<img alt="" src="${png}" style="width: 100%; height: auto; display: block;${retrato ? ` clip-path: inset(0 0 ${Math.max(0, (1 - 2 * ceu.cy / ceu.height) * 100).toFixed(2)}% 0);` : ''}">`;
    // o céu da roda cobre a tela inteira; o céu rápido de antes sai de cena
    camada.style.backgroundImage = 'none';
    camada.style.backgroundColor = '#070d25';
  }

  let _resizeCeuLoginTimeout = null;
  window.addEventListener('resize', () => {
    const overlay = document.getElementById('loginOverlay');
    if (!overlay || !overlay.classList.contains('visible')) return;
    clearTimeout(_resizeCeuLoginTimeout);
    _resizeCeuLoginTimeout = setTimeout(() => { renderizarCeuLogin(); }, 200);
  });

  function fecharTelaLogin() {
    document.getElementById('loginOverlay').classList.remove('visible');
  }

  function mostrarTelaLogin() {
    document.getElementById('loginOverlay').classList.add('visible');
    renderizarCeuLogin();
  }

  window.addEventListener('DOMContentLoaded', async () => {
    const client = window.supabaseClient || (typeof supabaseClient !== 'undefined' ? supabaseClient : null);
    if (client) {
      client.auth.onAuthStateChange(evento => { if (evento === 'PASSWORD_RECOVERY') entrarModoNovaSenha(); });
      /* Checagem rápida e local (sem esperar resposta do servidor) pra não
         piscar a tela de login à toa quando o usuário já está logado e só
         voltou de outro app ou desbloqueou o celular. */
      const { data: { session } } = await client.auth.getSession();
      if (window.__recuperacaoSenha && session) {
        entrarModoNovaSenha();
      } else if (!session) {
        mostrarTelaLogin();
      } else {
        const user = session.user;
        if (typeof carregarTemaMandala === 'function') carregarTemaMandala(user.id);
        if (typeof carregarEstiloPlanetas === 'function') carregarEstiloPlanetas(user.id);
        if (typeof carregarEstiloMandala === 'function') carregarEstiloMandala(user.id);
        if (typeof carregarMostrarRotulosGlifos === 'function') carregarMostrarRotulosGlifos(user.id);
        if (typeof carregarOrdenacaoClientes === 'function') carregarOrdenacaoClientes(user.id);
        if (typeof carregarOrdemBotoesTopo === 'function') carregarOrdemBotoesTopo(user.id);

        /* Confirma a sessão com o servidor em segundo plano, sem travar a
           tela: só interrompe o usuário se o token realmente não for mais
           válido (ex.: senha trocada em outro aparelho). */
        client.auth.getUser().then(({ data, error }) => {
          if (error || !data || !data.user) mostrarTelaLogin();
        });
      }
    }
  });

    /* FUNÇÃO GLOBAL PARA EXPORTAR QUALQUER TABELA EM PNG */
function salvarModuloEmPNG(containerId, nomeArquivo) {
  const elemento = document.getElementById(containerId);
  if (!elemento) {
    alert("Conteúdo não encontrado para exportar.");
    return;
  }

  if (typeof html2canvas !== 'function') {
    alert("Biblioteca de exportação não encontrada.");
    return;
  }

  html2canvas(elemento, {
    backgroundColor: '#ffffff',
    scale: 2,
    useCORS: true
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = `${nomeArquivo || 'tabela-astrologica'}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(err => {
    console.error("Erro ao gerar PNG:", err);
  });
}

</script>
