<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Hellenic</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">


    <!-- FONTES E ÍCONES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SUPABASE CLIENT SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-sidebar: #ffffff;
            --primary-blue: #103b70;
            --gold-primary: #d4af37;
            --gold-dark: #9a6d18;
            --text-dark: #0f172a;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            height: 100dvh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            display: flex;
        }

        /* PAINEL LATERAL */
        #sidebar {
            width: 320px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .menu-list {
            list-style: none;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-item {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s ease;
        }

        .menu-item:hover, .menu-item.active {
            background: #f1f5f9;
            color: var(--primary-blue);
        }

        .menu-item i {
            color: var(--gold-dark);
        }

        .database-section {
            padding: 12px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .folders-container {
            display: flex;
            gap: 4px;
            align-items: center;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .folder-tab-btn {
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .folder-tab-btn:hover {
            background: #f1f5f9;
        }

        .folder-tab-btn.active {
            background: #e0f2fe;
            color: var(--primary-blue);
            border-color: #93c5fd;
        }

        .folder-action-icon {
            font-size: 10px;
            opacity: 0.6;
            padding: 2px;
            transition: opacity 0.15s;
        }
        .folder-action-icon:hover { opacity: 1; }
        .folder-delete-icon:hover { color: #dc2626; }

        .add-folder-btn {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary-blue);
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fafafa;
            cursor: pointer;
            white-space: nowrap;
        }

        .search-box-container {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .client-search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }

        .client-list-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fafafa;
        }

        .client-card-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s ease;
        }

        .client-card-item:hover {
            background: #f1f5f9;
        }

        .client-card-item.selected {
            background: #e0f2fe;
            border-left: 4px solid var(--primary-blue);
        }

        .client-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary-blue);
        }

        .client-meta {
            font-size: 10px;
            font-weight: 500;
            color: #64748b;
            margin-top: 2px;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .action-record-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            font-size: 12px;
            opacity: 0.7;
            transition: opacity 0.15s;
        }
        .action-record-btn:hover { opacity: 1; }
        .edit-btn { color: var(--primary-blue); }
        .delete-btn { color: #dc2626; }

        /* ÁREA PRINCIPAL DA MANDALA */
        #main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            min-width: 0;
        }

        /* BARRA SUPERIOR */
        #top-bar {
            height: 52px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            gap: 8px;
            flex-shrink: 0;
            width: 100%;
        }

        .top-bar-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--primary-blue);
            font-size: 15px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 4px;
            transition: background 0.15s ease;
        }

        .icon-btn:hover {
            background: #f1f5f9;
        }

        .time-stepper {
            display: flex;
            align-items: center;
            gap: 2px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px;
        }

        .time-select {
            border: none;
            background: transparent;
            font-size: 11px;
            font-weight: 600;
            color: #334155;
            padding: 2px 4px;
            outline: none;
            cursor: pointer;
        }

        /* PALCO DA MANDALA */
        #mandala-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
        }

        #mandala-container img {
            max-width: 100%;
            max-height: calc(100vh - 62px);
            width: auto;
            height: auto;
            display: block;
        }

        /* MODAIS PERSONALIZADOS */
        #modalOverlay, #modalEditOverlay, #modalImportOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #ffffff;
            width: 460px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 800;
            color: var(--primary-blue);
        }
        .modal-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .modal-textarea {
            width: 100%;
            height: 160px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            font-family: monospace;
            outline: none;
            resize: vertical;
        }
        .city-results {
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fafafa;
            display: none;
        }
        .city-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }
        .city-item:hover { background: #f1f5f9; }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-primary { background: var(--primary-blue); color: #fff; padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }
        .btn-secondary { background: #e2e8f0; color: #334155; padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: auto; }
        }
    </style>
</head>
<body>

    <!-- PAINEL LATERAL DE NAVEGAÇÃO -->
    <aside id="sidebar">
              <div class="sidebar-header">
            <h1 class="sidebar-title">Astro Hellenic</h1>
        </div>

        <ul class="menu-list">
            <li class="menu-item active" id="menu-here-now" onclick="carregarCeuDoMomento()">
                <span>Agora</span>
                <i class="fa-solid fa-clock"></i>
            </li>
            <li class="menu-item" onclick="abrirModalNovoMapa()">
                <span>Novo Mapa Natal</span>
                <i class="fa-solid fa-user-plus"></i>
            </li>
            <li class="menu-item" onclick="abrirModalImportacaoTexto()">
                <span>Importar Lista em Massa</span>
                <i class="fa-solid fa-file-import"></i>
            </li>
        </ul>

        <!-- SELEÇÃO DE PASTAS E BUSCA -->
        <div class="database-section">
            <div id="foldersBarContainer" class="folders-container">
                <button type="button" class="folder-tab-btn active" id="folder-tab-Clientes" onclick="selecionarPasta('Clientes')">
                    <i class="fa-solid fa-folder"></i> Clientes
                </button>
                <button type="button" onclick="criarNovaPasta()" class="add-folder-btn" title="Criar Nova Pasta">
                    <i class="fa-solid fa-plus"></i> Pasta
                </button>
            </div>

            <div class="search-box-container">
                <input type="text" id="filterClientsInput" class="client-search-input" placeholder="Buscar por código ou nome..." oninput="executarBuscaLocalOuRemota(this.value)" onkeypress="if(event.key==='Enter') buscarDiretoPorCodigoOuNome()">
                <button type="button" onclick="buscarDiretoPorCodigoOuNome()" class="icon-btn" style="border: 1px solid var(--border-color); background: #fafafa;" title="Buscar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            
            <div id="searchStatusFeedback" style="font-size: 10px; font-weight: 600; min-height: 14px; margin-bottom: 4px;"></div>

            <div id="clientsListContainer" class="client-list-container">
                <div style="padding: 12px; font-size: 11px; color: #64748b; text-align: center;">
                    <i class="fa-solid fa-spinner fa-spin" style="margin-right: 4px;"></i> Carregando...
                </div>
            </div>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main id="main-stage">
        
        <!-- BARRA SUPERIOR -->
        <div id="top-bar">
            <div class="top-bar-controls">
                <button class="icon-btn" onclick="carregarCeuDoMomento()" title="Atualizar Momento">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button class="icon-btn" onclick="salvarMapaNaPlanilha()" title="Salvar Mapa no Banco">
                    <i class="fa-solid fa-floppy-disk"></i>
                </button>
                <button class="icon-btn" onclick="salvarImagemMandala()" title="Exportar Imagem PNG">
                    <i class="fa-solid fa-share-from-square"></i>
                </button>
            </div>

            <!-- NAVEGADOR TEMPORAL (STEPPER) -->
            <div class="time-stepper">
                <button class="icon-btn" onclick="ajustarTempo(-1)"><i class="fa-solid fa-backward-step"></i></button>
               <select id="stepUnit" class="time-select">
    <option value="second">Segundo</option>
    <option value="minute">Minuto</option>
    <option value="hour">Hora</option>
    <option value="day" selected>Dia</option>
    <option value="month">Mês</option>
    <option value="year">Ano</option>
</select>
                <button class="icon-btn" onclick="ajustarTempo(1)"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>

        <!-- RENDERIZADOR DA MANDALA -->
        <div id="mandala-container">
            <div id="loadingSpinner" style="color: #64748b; font-size: 13px; font-weight: 600; text-align: center;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: #103b70; margin-bottom: 8px; display: block;"></i>
                Gerando mapa...
            </div>
        </div>

    </main>

    <!-- MODAL DE NOVO MAPA NATAL -->
    <div id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title">Novo Mapa Natal</div>
            <div>
                <label style="font-size: 11px; font-weight: 600; color: #64748b;">Código (Opcional)</label>
                <input type="text" id="modalCodigo" class="modal-input" placeholder="Ex: 0011 (deixe em branco se não tiver)">
            </div>
            <div>
                <label style="font-size: 11px; font-weight: 600; color: #64748b;">Nome Completo / Identificação</label>
                <input type="text" id="modalNome" class="modal-input" placeholder="Ex: Eryell Souza">
            </div>
            <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                    <label style="font-size: 11px; font-weight: 600; color: #64748b;">Data (DD/MM/AAAA)</label>
                    <input type="text" id="modalData" class="modal-input" placeholder="11/06/1999">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 11px; font-weight: 600; color: #64748b;">Horário (HH:MM)</label>
                    <input type="text" id="modalHora" class="modal-input" placeholder="18:28" value="12:00">
                </div>
            </div>
            <div style="position: relative;">
                <label style="font-size: 11px; font-weight: 600; color: #64748b;">Cidade de Nascimento</label>
                <input type="text" id="modalCidadeInput" class="modal-input" placeholder="Digite a cidade (ex: Mauá, SP)..." oninput="pesquisarCidadesAutocomplete(this.value, 'cityResultsList')">
                <div id="cityResultsList" class="city-results"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="fecharModalNovoMapa()">Cancelar</button>
                <button type="button" class="btn-primary" onclick="confirmarNovoMapaModal()">Gerar Mapa</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE EDIÇÃO DE MAPA -->
    <div id="modalEditOverlay">
        <div class="modal-box">
            <div class="modal-title">Editar Mapa</div>
            <input type="hidden" id="editModalId">
            <div>
                <label style="font-size: 11px; font-weight: 600; color: #64748b;">Código (Opcional)</label>
                <input type="text" id="editModalCodigo" class="modal-input">
            </div>
            <div>
                <label style="font-size: 11px; font-weight: 600; color: #64748b;">Nome Completo / Identificação</label>
                <input type="text" id="editModalNome" class="modal-input">
            </div>
            <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                    <label style="font-size: 11px; font-weight: 600; color: #64748b;">Data (DD/MM/AAAA)</label>
                    <input type="text" id="editModalData" class="modal-input">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 11px; font-weight: 600; color: #64748b;">Horário (HH:MM)</label>
                    <input type="text" id="editModalHora" class="modal-input">
                </div>
            </div>
            <div style="position: relative;">
                <label style="font-size: 11px; font-weight: 600; color: #64748b;">Cidade de Nascimento</label>
                <input type="text" id="editModalCidadeInput" class="modal-input" oninput="pesquisarCidadesAutocomplete(this.value, 'editCityResultsList', true)">
                <div id="editCityResultsList" class="city-results"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="fecharModalEdicao()">Cancelar</button>
                <button type="button" class="btn-primary" onclick="salvarEdicaoMapaModal()">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE IMPORTAÇÃO EM MASSA POR TEXTO -->
    <div id="modalImportOverlay">
        <div class="modal-box">
            <div class="modal-title">Importar Lista de Clientes em Massa</div>
            <p style="font-size: 11px; color: #64748b;">Cole abaixo a sua lista. Aceita formatos como:<br><b>0011 - Eryell Souza, 11/06/1999, 18:28, Mauá</b></p>
            <textarea id="importTextArea" class="modal-textarea" placeholder="Exemplo:
0011 - Eryell Souza, 11/06/1999, 18:28, Mauá
0012 - João Silva, 05/08/1985, 09:15, São Paulo"></textarea>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="fecharModalImportacaoTexto()">Cancelar</button>
                <button type="button" class="btn-primary" onclick="processarImportacaoTextoEmMassa()">Importar Todos</button>
            </div>
        </div>
    </div>

        <!-- CARREGAMENTO DOS MÓDULOS DE CÓDIGO SEPARADOS -->
    <script src="supabase.js"></script>
    <script src="mandala.js"></script>
    <script src="isopsefia.js"></script>
    <script src="revolucao.js"></script>
    <script src="decenios.js"></script>
    <script src="direcoes.js"></script>
    <script src="liberacao.js"></script>
    <script src="horas.js"></script>
    <script src="perguntas.js"></script>
</body>
</html>
