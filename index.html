<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Hellenic</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="favicon.png?v=2">

    <!-- FONTES E ÍCONES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- SUPABASE CLIENT SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-sidebar: #ffffff;
            --primary-blue: #103b70;
            --gold-primary: #d4af37;
            --gold-dark: #9a6d18;
            --text-dark: #0f172a;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            height: 100dvh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            display: flex;
        }

        /* PAINEL LATERAL */
        #sidebar {
            width: 320px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .menu-list {
            list-style: none;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-item {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s ease;
        }

        .menu-item:hover, .menu-item.active {
            background: #f1f5f9;
            color: var(--primary-blue);
        }

        .menu-item i {
            color: var(--gold-dark);
        }

        .database-section {
            padding: 12px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .folders-container {
            display: flex;
            gap: 4px;
            align-items: center;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .folder-tab-btn {
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .folder-tab-btn:hover {
            background: #f1f5f9;
        }

        .folder-tab-btn.active {
            background: #e0f2fe;
            color: var(--primary-blue);
            border-color: #93c5fd;
        }

        .folder-action-icon {
            font-size: 10px;
            opacity: 0.6;
            padding: 2px;
            transition: opacity 0.15s;
        }
        .folder-action-icon:hover { opacity: 1; }
        .folder-delete-icon:hover { color: #dc2626; }

        .add-folder-btn {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary-blue);
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fafafa;
            cursor: pointer;
            white-space: nowrap;
        }

        .search-box-container {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .client-search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }

        .client-list-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fafafa;
        }

        .client-card-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s ease;
        }

        .client-card-item:hover {
            background: #f1f5f9;
        }

        .client-card-item.selected {
            background: #e0f2fe;
            border-left: 4px solid var(--primary-blue);
        }

        .client-name {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary-blue);
        }

        .client-meta {
            font-size: 10px;
            font-weight: 500;
            color: #64748b;
            margin-top: 2px;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .action-record-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            font-size: 12px;
            opacity: 0.7;
            transition: opacity 0.15s;
        }
        .action-record-btn:hover { opacity: 1; }
        .edit-btn { color: var(--primary-blue); }
        .delete-btn { color: #dc2626; }

        /* ÁREA PRINCIPAL DA MANDALA */
        #main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            min-width: 0;
        }

        /* BARRA SUPERIOR */
        #top-bar {
            height: 52px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            gap: 8px;
            flex-shrink: 0;
            width: 100%;
        }

        .top-bar-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--primary-blue);
            font-size: 15px;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 4px;
            transition: background 0.15s ease;
        }

        .icon-btn:hover {
            background: #f1f5f9;
        }

        .time-stepper {
            display: flex;
            align-items: center;
            gap: 2px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px;
        }

        .time-select {
            border: none;
            background: transparent;
            font-size: 11px;
            font-weight: 600;
            color: #334155;
            padding: 2px 4px;
            outline: none;
            cursor: pointer;
        }

        /* PALCO DA MANDALA */
        #mandala-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            background-color: #ffffff;
            overflow: hidden;
        }

        #mandala-container img {
            max-width: 100%;
            max-height: calc(100vh - 62px);
            width: auto;
            height: auto;
            display: block;
        }

        /* MODAIS PERSONALIZADOS */
        #modalOverlay, #modalEditOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #ffffff;
            width: 420px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 800;
            color: var(--primary-blue);
        }
        .modal-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .city-results {
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fafafa;
            display: none;
        }
        .city-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }
        .city-item:hover { background: #f1f5f9; }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-primary { background: var(--primary-blue); color: #fff; padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }
        .btn-secondary { background: #e2e8f0; color: #334155; padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: auto; }
        }
    </style>
</head>
<body>

    <!-- INPUT OCULTO PARA SELEÇÃO DO ICLOUD -->
    <input type="file" id="filePickerInput" accept=".SFcht,.sfcht" style="display: none;" onchange="processarArquivoSelecionadoIcloud(event)">

    <!-- PAINEL LATERAL DE NAVEGAÇÃO -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <h1 class="sidebar-title">Astro Hellenic</h1>
            <button class="icon-btn" onclick="limparPastaAtualSupabase()" title="Limpar todos os mapas desta pasta" style="color: #dc2626;">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>

        <ul class="menu-list">
            <li class="menu-item active" id="menu-here-now" onclick="carregarCeuDoMomento()">
                <span>Céu do Momento (Here & Now)</span>
                <i class="fa-solid fa-clock"></i>
            </li>
            <li class="menu-item" onclick="abrirModalNovoMapa()">
                <span>Novo Mapa Natal</span>
                <i class="fa-solid fa-user-plus"></i>
            </li>
        </ul>

        <!-- SELEÇÃO DE PASTAS E BUSCA -->
        <div class="database-section">
            <div id="foldersBarContainer" class="folders-container">
                <button type="button" class="folder-tab-btn active" id="folder-tab-Clientes" onclick="selecionarPasta('Clientes')">
                    <i class="fa-solid fa-folder"></i> Clientes
                </button>
                <button type="button" onclick="criarNovaPasta()" class="add-folder-btn" title="Criar Nova Pasta">
                    <i class="fa-solid fa-plus"></i> Pasta
                </button>
            </div>

            <div class="search-box-container">
                <input type="text" id="filterClientsInput" class="client-search-input" placeholder="Buscar por código ou nome..." oninput="executarBuscaLocalOuRemota(this.value)" onkeypress="if(event.key==='Enter') buscarDiretoPorCodigoOuNome()">
                <button type="button" onclick="buscarDiretoPorCodigoOuNome()" class="icon-btn" style="border: 1px solid var(--border-color); background: #fafafa;" title="Buscar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            
            <div id="searchStatusFeedback" style="font-size: 10px; font-weight: 600; min-height: 14px; margin-bottom: 4px;"></div>

            <div id="clientsListContainer" class="client-list-container">
                <div style="padding: 12px; font-size: 11px; color: #64748b; text-align: center;">
                    <i class="fa-solid fa-spinner fa-spin" style="margin-right: 4px;"></i> Carregando...
                </div>
            </div>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main id="main-stage">
        
        <!-- BARRA SUPERIOR -->
        <div id="top-bar">
            <div class="top-bar-controls">
                <button class="icon-btn" onclick="carregarCeuDoMomento()" title="Atualizar Momento">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button class="icon-btn" onclick="salvarMapaNaPlanilha()" title="Salvar Mapa no Banco">
                    <i class="fa-solid fa-floppy-disk"></i>
                </button>
                <button class="icon-btn" onclick="salvarImagemMandala()" title="Exportar Imagem PNG">
                    <i class="fa-solid fa-share-from-square"></i>
                </button>
                <!-- BOTÃO DE SELEÇÃO DIRETA DO ICLOUD -->
                <button class="icon-btn" onclick="abrirSeletorIcloud()" title="Importar .SFcht do iCloud / Astro Gold" style="color: #9a6d18;">
                    <i class="fa-solid fa-file-import"></i>
                </button>
            </div>

            <!-- NAVEGADOR TEMPORAL (STEPPER) -->
            <div class="time-stepper">
                <button class="icon-btn" onclick="ajustarTempo(-1)"><i class="fa-solid fa-backward-step"></i></button>
                <select id="stepUnit" class="time-select">
                    <option value="second">Segundo</option>
                    <option value="minute">Minuto</option>
                    <option value="hour">Hora</option>
                    <option value="day">Dia</option>
                    <option value="month" selected>Mês</option>
                    <option value="year">Ano</option>
                </select>
                <button class="icon-btn" onclick="ajustarTempo(1)"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>

        <!-- RENDERIZADOR DA MANDALA -->
        <div id="mandala-container">
            <div id="loadingSpinner" style="color: #64748b; font-size: 13px; font-weight: 600; text-align: center;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: #103b70; margin-bottom: 8px; display: block;"></i>
                Gerando mapa...
            </div>
        </div>

    </main>

    <!-- MODAL DE NOVO MAPA NATAL -->
    <div id="modalOverlay">
        <div class="modal-box">
            <div class="modal-title">Novo Mapa Natal</div>
            <div>
                <label style="font-size: 11px; font-weight: 600; color: #64748b;">Código (Opcional)</label>
                <input type="text" id="modalCodigo" class="modal-input" placeholder="Ex: C-001 (deixe em branco se não tiver)">
            </div>
            <div>
                <label style="font-size: 11px; font-weight: 600; color: #64748b;">Nome Completo / Identificação</label>
                <input type="text" id="modalNome" class="modal-input" placeholder="Ex: Cássio Pereira">
            </div>
            <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                    <label style="font-size: 11px; font-weight: 600; color: #64748b;">Data (DD/MM/AAAA)</label>
                    <input type="text" id="modalData" class="modal-input" placeholder="09/10/1989">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 11px; font-weight: 600; color: #64748b;">Horário (HH:MM)</label>
                    <input type="text" id="modalHora" class="modal-input" placeholder="11:00" value="12:00">
                </div>
            </div>
            <div style="position: relative;">
                <label style="font-size: 11px; font-weight: 600; color: #64748b;">Cidade de Nascimento</label>
                <input type="text" id="modalCidadeInput" class="modal-input" placeholder="Digite a cidade (ex: Belém, PA)..." oninput="pesquisarCidadesAutocomplete(this.value, 'cityResultsList')">
                <div id="cityResultsList" class="city-results"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="fecharModalNovoMapa()">Cancelar</button>
                <button type="button" class="btn-primary" onclick="confirmarNovoMapaModal()">Gerar Mapa</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE EDIÇÃO DE MAPA -->
    <div id="modalEditOverlay">
        <div class="modal-box">
            <div class="modal-title">Editar Mapa</div>
            <input type="hidden" id="editModalId">
            <div>
                <label style="font-size: 11px; font-weight: 600; color: #64748b;">Código (Opcional)</label>
                <input type="text" id="editModalCodigo" class="modal-input">
            </div>
            <div>
                <label style="font-size: 11px; font-weight: 600; color: #64748b;">Nome Completo / Identificação</label>
                <input type="text" id="editModalNome" class="modal-input">
            </div>
            <div style="display: flex; gap: 8px;">
                <div style="flex: 1;">
                    <label style="font-size: 11px; font-weight: 600; color: #64748b;">Data (DD/MM/AAAA)</label>
                    <input type="text" id="editModalData" class="modal-input">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 11px; font-weight: 600; color: #64748b;">Horário (HH:MM)</label>
                    <input type="text" id="editModalHora" class="modal-input">
                </div>
            </div>
            <div style="position: relative;">
                <label style="font-size: 11px; font-weight: 600; color: #64748b;">Cidade de Nascimento</label>
                <input type="text" id="editModalCidadeInput" class="modal-input" oninput="pesquisarCidadesAutocomplete(this.value, 'editCityResultsList', true)">
                <div id="editCityResultsList" class="city-results"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="fecharModalEdicao()">Cancelar</button>
                <button type="button" class="btn-primary" onclick="salvarEdicaoMapaModal()">Salvar Alterações</button>
            </div>
        </div>
    </div>

    function formatDegMin(absDeg) {
      const degInSign = absDeg % 30;
      const degrees = Math.floor(degInSign);
      const minutes = Math.round((degInSign - degrees) * 60);
      const minStr = minutes < 10 ? `0${minutes}` : `${minutes}`;
      return `${degrees}°${minStr}′`;
    }

    function eclToScreenAngle(eclDeg, ascAbs) {
      return (180 - (eclDeg - ascAbs) + 36000) % 360;
    }

    function polarToCart(cx, cy, r, angleDeg) {
      const rad = angleDeg * Math.PI / 180.0;
      return { x: cx + (r * Math.cos(rad)), y: cy + (r * Math.sin(rad)) };
    }

    function calculateSevenLots(ascAbs, isDay, planetObj) {
      const sun = planetObj.Sun.abs;
      const moon = planetObj.Moon.abs;
      const merc = planetObj.Mercury.abs;
      const ven = planetObj.Venus.abs;
      const mars = planetObj.Mars.abs;
      const jup = planetObj.Jupiter.abs;
      const sat = planetObj.Saturn.abs;

      const fortAbs = (isDay ? (ascAbs + moon - sun) : (ascAbs + sun - moon) + 36000) % 360;
      const spirAbs = (isDay ? (ascAbs + sun - moon) : (ascAbs + moon - sun) + 36000) % 360;
      const erosAbs = (isDay ? (ascAbs + ven - spirAbs) : (ascAbs + spirAbs - ven) + 36000) % 360;
      const necAbs = (isDay ? (ascAbs + fortAbs - merc) : (ascAbs + merc - fortAbs) + 36000) % 360;
      const courAbs = (isDay ? (ascAbs + fortAbs - mars) : (ascAbs + mars - fortAbs) + 36000) % 360;
      const vicAbs = (isDay ? (ascAbs + jup - spirAbs) : (ascAbs + spirAbs - jup) + 36000) % 360;
      const nemAbs = (isDay ? (ascAbs + fortAbs - sat) : (ascAbs + sat - fortAbs) + 36000) % 360;

      return [
        { label: "FORT", type: "fortune", deg: fortAbs },
        { label: "ESP", type: "spirit", deg: spirAbs },
        { label: "EROS", type: "venus", sym: "♀", deg: erosAbs },
        { label: "NEC", type: "mercury", sym: "☿", deg: necAbs },
        { label: "AUD", type: "mars", sym: "♂", deg: courAbs },
        { label: "VIT", type: "jupiter", sym: "♃", deg: vicAbs },
        { label: "NÊM", type: "saturn", sym: "♄", deg: nemAbs }
      ];
    }

    function angleDist(a1, a2) {
      let diff = Math.abs(a1 - a2) % 360;
      return diff > 180 ? 360 - diff : diff;
    }

    function getRadiusForLevel(level) {
      switch(level) {
        case 0: return 198;
        case 1: return 174;
        case 2: return 150;
        case 3: return 126;
        default: return 198 - (level * 24);
      }
    }

    function carregarPastasSalvas() {
      try {
        const saved = localStorage.getItem('astro_custom_folders');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) customFolders = parsed;
        }
      } catch (e) {}
      renderBarraDePastas();
    }

    function salvarPastasStorage() {
      try {
        localStorage.setItem('astro_custom_folders', JSON.stringify(customFolders));
      } catch (e) {}
    }

    function criarNovaPasta() {
      const nome = prompt("Nome da nova pasta:");
      if (!nome || !nome.trim()) return;
      const limpo = nome.trim();
      if (!customFolders.includes(limpo)) {
        customFolders.push(limpo);
        salvarPastasStorage();
        renderBarraDePastas();
        selecionarPasta(limpo);
      } else {
        selecionarPasta(limpo);
      }
    }

    async function editarNomePasta(event, pastaAntiga) {
      event.stopPropagation();
      const novoNome = prompt(`Novo nome para a pasta "${pastaAntiga}":`, pastaAntiga);
      if (!novoNome || !novoNome.trim() || novoNome.trim() === pastaAntiga) return;
      
      const nomeLimpo = novoNome.trim();

      try {
        // Atualiza os registros do Supabase para refletirem o novo nome da pasta
        await _supabase.from('mapas').update({ pasta: nomeLimpo }).eq('pasta', pastaAntiga);
        
        const index = customFolders.indexOf(pastaAntiga);
        if (index !== -1) {
          customFolders[index] = nomeLimpo;
          salvarPastasStorage();
          if (activeFolder === pastaAntiga) activeFolder = nomeLimpo;
          renderBarraDePastas();
          carregarConteudoPastaAtual();
        }
      } catch (e) {
        alert("Erro ao renomear pasta.");
      }
    }

    async function apagarPasta(event, pastaParaDeletar) {
      event.stopPropagation();

      if (customFolders.length <= 1) {
        alert("Você precisa manter pelo menos uma pasta.");
        return;
      }

      if (confirm(`Deseja remover a pasta "${pastaParaDeletar}"?\n\nOs mapas salvos nela no banco de dados também serão apagados.`)) {
        try {
          await _supabase.from('mapas').delete().eq('pasta', pastaParaDeletar);
          
          customFolders = customFolders.filter(p => p !== pastaParaDeletar);
          salvarPastasStorage();

          if (activeFolder === pastaParaDeletar) {
            activeFolder = customFolders[0];
          }

          renderBarraDePastas();
          carregarConteudoPastaAtual();
        } catch (e) {
          alert("Erro ao apagar pasta do banco de dados.");
        }
      }
    }

          cachedFolderData = data.map(item => ({

            codigo: (item.codigo && String(item.codigo).trim() !== '') ? item.codigo : null,

            horaNascimento: item.hora_nascimento,

    async function salvarEdicaoMapaModal() {
      const idMapa = document.getElementById('editModalId').value;
      const codDigitado = document.getElementById('editModalCodigo').value.trim();
      const nome = document.getElementById('editModalNome').value.trim();
      const dataStr = document.getElementById('editModalData').value.trim();
      const horaStr = document.getElementById('editModalHora').value.trim();

      if (!nome) { alert("Informe o nome."); return; }
      if (!dataStr || !dataStr.includes('/')) { alert("Informe a data no formato DD/MM/AAAA."); return; }
      if (!horaStr) { alert("Informe o horário."); return; }

      try {
        const { error } = await _supabase
          .from('mapas')
          .update({
            codigo: codDigitado !== "" ? codDigitado : null,
            nome: nome,
            data_nascimento: dataStr,
            hora_nascimento: horaStr,
            cidade: editSelectedCityGeo ? editSelectedCityGeo.name : document.getElementById('editModalCidadeInput').value,
            latitude: editSelectedCityGeo ? editSelectedCityGeo.lat : -23.5505,
            longitude: editSelectedCityGeo ? editSelectedCityGeo.lon : -46.6333
          })
          .eq('id', idMapa);

        if (!error) {
          fecharModalEdicao();
          carregarConteudoPastaAtual();
        } else {
          alert("Erro ao atualizar o mapa: " + error.message);
        }
      } catch (err) {
        alert("Erro de conexão ao atualizar.");

      if (cachedFolderData.length > 0) {
        const filtrados = cachedFolderData.filter(item => 
          (item.nome && item.nome.toLowerCase().includes(q)) || 
          (item.codigo && String(item.codigo).toLowerCase().includes(q)) ||
          (item.cidade && item.cidade.toLowerCase().includes(q))
        );
        renderListaPasta(filtrados);

    function aplicarDadosDoPerfilNoMapa(c) {
      document.getElementById('menu-here-now').classList.remove('active');

      let ano = 2000, mes = 1, dia = 1;
      if (c.dataNascimento && c.dataNascimento.includes('/')) {
        const partes = c.dataNascimento.split('/');
        if (partes.length === 3) {
          dia = parseInt(partes[0]);
          mes = parseInt(partes[1]);
          ano = parseInt(partes[2]);
        }
      }

      let hora = 12, min = 0;
      if (c.horaNascimento && c.horaNascimento.includes(':')) {
        const partesH = c.horaNascimento.split(':');
        if (partesH.length >= 2) {
          hora = parseInt(partesH[0]);
          min = parseInt(partesH[1]);
        }
      }

      currentSubjectName = c.nome || "Nativo";
      currentCustomCode = c.codigo || null;
      currentMoment = new Date(ano, mes - 1, dia, hora, min);

      const lat = parseFloat(c.latitude) || -23.5505;
      const lon = parseFloat(c.longitude) || -46.6333;
      const cidade = c.cidade || "Localidade não informada";

      currentGeo = { lat, lon, city: cidade };
      executarCalculo();
    }

    function abrirSeletorIcloud() {

    async function processarArquivoSelecionadoIcloud(event) {
      const file = event.target.files[0];
      if (!file) return;

      let nomeSemExtensao = file.name.replace(/\.[^/.]+$/, "");
      let partesNomePasta = nomeSemExtensao.split('-');
      let pastaDestino = partesNomePasta.length > 1 ? partesNomePasta[1].trim() : activeFolder;

      try {
        const buffer = await file.arrayBuffer();
        const decoder = new TextDecoder('latin1');
        const textoBruto = decoder.decode(buffer);

        const blocos = textoBruto.split(/[\x00-\x1F\x7F-\x9F]+/g);
        const registrosValidos = [];

        for (let bloco of blocos) {
          let limpo = bloco.replace(/[^\x20-\x7E\xA0-\xFF]/g, '').trim();
          if (limpo.length >= 3 && !/^(Created|SolarFire|AstroGold|Chart|ChartData)$/i.test(limpo)) {
            if (/^[A-Za-zÀ-ú0-9\s\-\.\,\']+$/.test(limpo) && !registrosValidos.includes(limpo)) {
              registrosValidos.push(limpo);
            }
          }
        }

        if (registrosValidos.length === 0) {
          alert("Não foram encontrados registros legíveis no arquivo.");
          return;
        }

        let inseridos = 0;
        for (let reg of registrosValidos.slice(0, 300)) {
          const { error } = await _supabase
            .from('mapas')
            .insert([{
              pasta: pastaDestino,
              codigo: null,
              nome: reg,
              data_nascimento: '01/01/2000',
              hora_nascimento: '12:00',
              cidade: 'Brasil',
              latitude: -23.5505,
              longitude: -46.6333
            }]);

          if (!error) inseridos++;
        }

        alert(`Sucesso! ${inseridos} mapas importados para a pasta "${pastaDestino}".`);
        
        if (!customFolders.includes(pastaDestino)) {
          customFolders.push(pastaDestino);
          salvarPastasStorage();
          renderBarraDePastas();
        }
        selecionarPasta(pastaDestino);

      } catch (err) {
        alert("Erro ao ler o arquivo do iCloud.");
      }
      
      event.target.value = '';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function obterNomeCidade(lat, lon) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`);
        const data = await res.json();
        const addr = data.address || {};
        const cidade = addr.city || addr.town || addr.village || addr.municipality || "Local Localizado";
        const estado = addr.state ? `, ${addr.state}` : "";
        return `${cidade}${estado}`;
      } catch (e) {
        return "Jacareí, SP";
      }
    }

    function carregarCeuDoMomento() {
      document.getElementById('menu-here-now').classList.add('active');
      currentSubjectName = "Céu do Momento";
      currentCustomCode = null;
      currentMoment = new Date();

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const nomeCidade = await obterNomeCidade(lat, lon);
            currentGeo = { lat, lon, city: nomeCidade };
            executarCalculo();
          },
          () => {
            currentGeo = { lat: -23.5505, lon: -46.6333, city: "São Paulo, SP" };
            executarCalculo();
          },
          { timeout: 4000 }
        );
      } else {
        currentGeo = { lat: -23.5505, lon: -46.6333, city: "São Paulo, SP" };
        executarCalculo();
      }
    }

    function ajustarTempo(direcao) {
      const unit = document.getElementById('stepUnit').value;
      const amount = direcao;

      switch(unit) {
        case 'second': currentMoment.setSeconds(currentMoment.getSeconds() + amount); break;
        case 'minute': currentMoment.setMinutes(currentMoment.getMinutes() + amount); break;
        case 'hour': currentMoment.setHours(currentMoment.getHours() + amount); break;
        case 'day': currentMoment.setDate(currentMoment.getDate() + amount); break;
        case 'month': currentMoment.setMonth(currentMoment.getMonth() + amount); break;
        case 'year': currentMoment.setFullYear(currentMoment.getFullYear() + amount); break;
      }

      executarCalculo();
    }

    async function executarCalculo() {
      const ano = currentMoment.getFullYear();
      const mes = String(currentMoment.getMonth() + 1).padStart(2, '0');
      const dia = String(currentMoment.getDate()).padStart(2, '0');
      const dataStr = `${ano}-${mes}-${dia}`;

      const hora = String(currentMoment.getHours()).padStart(2, '0');
      const min = String(currentMoment.getMinutes()).padStart(2, '0');
      const horaStr = `${hora}:${min}`;

      try {
        const urlApi = `https://motor-astrologia.vercel.app/api/index?data=${dataStr}&hora=${horaStr}&fuso=-3&lat=${currentGeo.lat}&lon=${currentGeo.lon}`;
        const res = await fetch(urlApi);
        if (!res.ok) throw new Error("Erro na API");

        const apiJson = await res.json();

        const SIGNOS_INDEX = {
          "Aries": 0, "Touro": 1, "Gemeos": 2, "Cancer": 3,
          "Leao": 4, "Virgem": 5, "Libra": 6, "Escorpiao": 7,
          "Sagitario": 8, "Capricornio": 9, "Aquario": 10, "Peixes": 11
        };

        const planetas = apiJson.planetas || {};
        const ascData = apiJson.ascendente || {};
        const mcData = apiJson.meio_ceu || {};
        const sizigiaData = apiJson.sizigia || {};

        const ascAbs = ((SIGNOS_INDEX[ascData.signo] || 0) * 30) + (parseFloat(ascData.grau) || 0);
        const mcAbs = ((SIGNOS_INDEX[mcData.signo] || 0) * 30) + (parseFloat(mcData.grau) || 0);

        const checkRetro = (pObj) => {
          if (!pObj) return false;
          if (pObj.retrogrado !== undefined) return Boolean(pObj.retrogrado);
          if (pObj.velocidade !== undefined) return parseFloat(pObj.velocidade) < 0;
          return false;
        };

        currentCalculatedData = {
          Ascendente: { grau_absoluto: ascAbs },
          MC: { grau_absoluto: mcAbs },
          Nodo_Norte: { grau_absoluto: planetas.NodoNorte ? planetas.NodoNorte.grau_absoluto : 0, retro: checkRetro(planetas.NodoNorte) },
          Sizigia: { grau_absoluto: sizigiaData.grau_absoluto !== undefined ? parseFloat(sizigiaData.grau_absoluto) : 0 },
          Sol: { grau_absoluto: planetas.Sol ? planetas.Sol.grau_absoluto : 0, retro: false },
          Lua: { grau_absoluto: planetas.Lua ? planetas.Lua.grau_absoluto : 0, retro: false },
          Mercúrio: { grau_absoluto: planetas.Mercurio ? planetas.Mercurio.grau_absoluto : 0, retro: checkRetro(planetas.Mercurio) },
          Vênus: { grau_absoluto: planetas.Venus ? planetas.Venus.grau_absoluto : 0, retro: checkRetro(planetas.Venus) },
          Marte: { grau_absoluto: planetas.Marte ? planetas.Marte.grau_absoluto : 0, retro: checkRetro(planetas.Marte) },
          Júpiter: { grau_absoluto: planetas.Jupiter ? planetas.Jupiter.grau_absoluto : 0, retro: checkRetro(planetas.Jupiter) },
          Saturno: { grau_absoluto: planetas.Saturno ? planetas.Saturno.grau_absoluto : 0, retro: checkRetro(planetas.Saturno) }
        };

        renderMandala();

      } catch (err) {
        document.getElementById('mandala-container').innerHTML = `<p style="color: #dc2626;">Erro ao calcular posições.</p>`;
      }
    }

    function renderMandala() {
      const container = document.getElementById('mandala-container');
      if (!container || !currentCalculatedData) return;

      const data = currentCalculatedData;
      const ascAbs = data.Ascendente.grau_absoluto;
      const mcAbs = data.MC ? data.MC.grau_absoluto : (ascAbs + 270) % 360;
      const nodeAbs = data.Nodo_Norte ? data.Nodo_Norte.grau_absoluto : 0;
      const syzAbs = data.Sizigia ? data.Sizigia.grau_absoluto : 0;

      const pObj = {};
      PLANETS_DEF.forEach(p => {
        const item = data[p.key];
        pObj[p.id] = { abs: item ? item.grau_absoluto : 0, symbol: p.symbol, name: p.name, retro: item ? Boolean(item.retro) : false };
      });

      const isDay = ((pObj.Sun.abs - ascAbs + 360) % 360) >= 180;
      const sectText = isDay ? "• Natividade Diurna" : "• Natividade Noturna";

      const ano = currentMoment.getFullYear();
      const mes = String(currentMoment.getMonth() + 1).padStart(2, '0');
      const dia = String(currentMoment.getDate()).padStart(2, '0');
      const hora = String(currentMoment.getHours()).padStart(2, '0');
      const min = String(currentMoment.getMinutes()).padStart(2, '0');

      const width = 960, height = 1150, cx = 480, cy = 680;
      const R = { Aspects: 110, SignSector: 215, Dodec: 238, Termos: 262, Scale: 280 };
      const R_OuterLine = 399;
      const goldColor = "#c59b27";

      let svg = `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
        <rect width="${width}" height="${height}" fill="#ffffff"/>`;

      // CABEÇALHO DO PNG TAMBÉM LIMPO (SEM COLCHETES)
      const headerTitle = currentCustomCode ? `${currentCustomCode} ${currentSubjectName}` : currentSubjectName;

      svg += `<g id="png-discreet-header">
        <text x="50" y="120" font-family="'Cinzel', serif" font-size="26" font-weight="800" fill="#103b70">${escapeHtml(headerTitle)}</text>
        <text x="50" y="150" font-family="'Montserrat', sans-serif" font-size="14" font-weight="500" fill="#475569">${dia}/${mes}/${ano} às ${hora}:${min} • ${currentGeo.city}</text>
        <text x="50" y="172" font-family="'Montserrat', sans-serif" font-size="13" font-weight="500" fill="#64748b">Zodíaco Tropical • Signos Inteiros</text>
        <text x="50" y="194" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#9a6d18">${sectText}</text>
      </g>`;

      svg += `<circle cx="${cx}" cy="${cy}" r="${R.Aspects}" fill="#ffffff" stroke="${goldColor}" stroke-width="2"/>`;

      const occupiedSigns = new Set();
      PLANETS_DEF.forEach(p => { occupiedSigns.add(Math.floor(pObj[p.id].abs / 30)); });
      const occupiedArray = Array.from(occupiedSigns);
      for (let i = 0; i < occupiedArray.length; i++) {
        for (let j = i + 1; j < occupiedArray.length; j++) {
          let diff = Math.abs(occupiedArray[i] - occupiedArray[j]);
          if (diff > 6) diff = 12 - diff;
          let col = null;
          if (diff === 6) col = "#8b0000";
          else if (diff === 4) col = "#0b2545";
          else if (diff === 3) col = "#dc2626";
          else if (diff === 2) col = "#2563eb";

          if (col) {
            const pt1 = polarToCart(cx, cy, R.Aspects - 4, eclToScreenAngle(occupiedArray[i] * 30 + 15, ascAbs));
            const pt2 = polarToCart(cx, cy, R.Aspects - 4, eclToScreenAngle(occupiedArray[j] * 30 + 15, ascAbs));
            svg += `<line x1="${pt1.x}" y1="${pt1.y}" x2="${pt2.x}" y2="${pt2.y}" stroke="${col}" stroke-width="1.8" opacity="0.9"/>`;
          }
        }
      }

      svg += `<circle cx="${cx}" cy="${cy}" r="${R.SignSector}" fill="none" stroke="${goldColor}" stroke-width="2"/>`;
      svg += `<circle cx="${cx}" cy="${cy}" r="${R.Dodec}" fill="none" stroke="${goldColor}" stroke-width="1.5"/>`;
      svg += `<circle cx="${cx}" cy="${cy}" r="${R.Termos}" fill="none" stroke="${goldColor}" stroke-width="2"/>`;
      svg += `<circle cx="${cx}" cy="${cy}" r="${R.Scale}" fill="none" stroke="${goldColor}" stroke-width="1.5"/>`;

      const ascPt = polarToCart(cx, cy, R_OuterLine, eclToScreenAngle(ascAbs, ascAbs));
      const dscPt = polarToCart(cx, cy, R_OuterLine, (eclToScreenAngle(ascAbs, ascAbs) + 180) % 360);
      svg += `<line x1="${ascPt.x}" y1="${ascPt.y}" x2="${dscPt.x}" y2="${dscPt.y}" stroke="#000000" stroke-width="2.5"/>`;

      const mcPt = polarToCart(cx, cy, R_OuterLine, eclToScreenAngle(mcAbs, ascAbs));
      const icPt = polarToCart(cx, cy, R_OuterLine, (eclToScreenAngle(mcAbs, ascAbs) + 180) % 360);
      svg += `<line x1="${mcPt.x}" y1="${mcPt.y}" x2="${icPt.x}" y2="${icPt.y}" stroke="#000000" stroke-width="2.5"/>`;

      for (let i = 0; i < 12; i++) {
        const pt1 = polarToCart(cx, cy, R.Aspects, eclToScreenAngle(i * 30, ascAbs));
        const pt2 = polarToCart(cx, cy, R_OuterLine, eclToScreenAngle(i * 30, ascAbs));
        svg += `<line x1="${pt1.x}" y1="${pt1.y}" x2="${pt2.x}" y2="${pt2.y}" stroke="${goldColor}" stroke-width="1.8"/>`;
      }

      const allRingItems = [
        { label: "ASC", deg: ascAbs, color: "#000000", itemType: "axis" },
        { label: "DSC", deg: (ascAbs + 180) % 360, color: "#000000", itemType: "axis" },
        { label: "MC", deg: mcAbs, color: "#000000", itemType: "axis" },
        { label: "IC", deg: (mcAbs + 180) % 360, color: "#000000", itemType: "axis" }
      ];

      if (nodeAbs > 0) {
        allRingItems.push({ label: "☊", deg: nodeAbs, color: "#0d9488", itemType: "node" });
        allRingItems.push({ label: "☋", deg: (nodeAbs + 180) % 360, color: "#0d9488", itemType: "node" });
      }
      if (syzAbs > 0) {
        allRingItems.push({ label: "SIZ", deg: syzAbs, color: "#103b70", itemType: "syzygy" });
      }

      const lotes = calculateSevenLots(ascAbs, isDay, pObj);
      lotes.forEach(lot => {
        allRingItems.push({ label: lot.label, deg: lot.deg, color: goldColor, itemType: "lot", lotType: lot.type, sym: lot.sym });
      });

      allRingItems.forEach(item => item.aScreen = eclToScreenAngle(item.deg, ascAbs));
      allRingItems.sort((a, b) => a.aScreen - b.aScreen);

      allRingItems.forEach((item, idx) => {
        let usedLevels = new Set();
        for (let j = 0; j < allRingItems.length; j++) {
          if (idx !== j && angleDist(item.aScreen, allRingItems[j].aScreen) < 10.5) {
            if (allRingItems[j].level !== undefined) usedLevels.add(allRingItems[j].level);
          }
        }
        let lvl = 0;
        while (usedLevels.has(lvl)) lvl++;
        item.level = lvl;
      });

      allRingItems.forEach(item => {
        if (item.itemType !== "axis") {
          const itemR = getRadiusForLevel(item.level);
          const p1 = polarToCart(cx, cy, itemR + 12, item.aScreen);
          const p2 = polarToCart(cx, cy, R.SignSector, item.aScreen);
          svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${item.itemType === 'lot' ? goldColor : item.color}" stroke-width="1.5"/>`;
        }

        const itemR = getRadiusForLevel(item.level);
        const pTxt = polarToCart(cx, cy, itemR, item.aScreen);

        if (item.itemType === "syzygy") {
          svg += `<g transform="translate(${pTxt.x}, ${pTxt.y})">
            <circle cx="0" cy="0" r="12" fill="#ffffff" stroke="none"/>
            <circle cx="0" cy="0" r="10" stroke="${item.color}" stroke-width="1.8" fill="none"/>
            <path d="M 0 -10 A 10 10 0 0 1 0 10 Q 3.8 -3.8 -3.8 -10 Z" fill="${item.color}"/>
            <circle cx="0" cy="0" r="2.3" fill="${item.color}"/>
            <text x="0" y="21" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">${formatDegMin(item.deg)}</text>
          </g>`;
        } else if (item.itemType === "node") {
          svg += `<g transform="translate(${pTxt.x}, ${pTxt.y})">
            <text x="0" y="5" font-size="24" font-weight="bold" fill="${item.color}" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke fill">${item.label}</text>
            <text x="0" y="19" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">${formatDegMin(item.deg)}</text>
          </g>`;
        } else if (item.itemType === "axis") {
          svg += `<g transform="translate(${pTxt.x}, ${pTxt.y})">
            <rect x="-22" y="-12" width="44" height="24" rx="5" fill="#ffffff" stroke="${item.color}" stroke-width="1.8"/>
            <text x="0" y="4" font-size="14" font-weight="900" fill="${item.color}" text-anchor="middle">${item.label}</text>
            <text x="0" y="21" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">${formatDegMin(item.deg)}</text>
          </g>`;
        } else if (item.itemType === "lot") {
          svg += `<g transform="translate(${pTxt.x}, ${pTxt.y})">`;
          if (item.lotType === "fortune") {
            svg += `<circle cx="0" cy="0" r="10" fill="#ffffff" stroke="#103b70" stroke-width="1.5"/><line x1="-7" y1="-7" x2="7" y2="7" stroke="#103b70" stroke-width="1.5"/><line x1="7" y1="-7" x2="-7" y2="7" stroke="#103b70" stroke-width="1.5"/>`;
          } else if (item.lotType === "spirit") {
            svg += `<text x="0" y="7" font-size="22" font-weight="700" font-family="'Cinzel', serif" fill="#103b70" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">&#x03A6;</text>`;
          } else {
            svg += `<circle cx="0" cy="0" r="10" fill="#ffffff" stroke="#103b70" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="bold" fill="#103b70" text-anchor="middle">${item.sym}</text>`;
          }
          svg += `<text x="0" y="17" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">${formatDegMin(item.deg)}</text></g>`;
        }
      });

      const ascSignIdx = Math.floor(ascAbs / 30);
      for (let i = 0; i < 12; i++) {
        const aMid = eclToScreenAngle((i * 30) + 15, ascAbs);
        const pNum = polarToCart(cx, cy, 122, aMid);
        svg += `<text x="${pNum.x}" y="${pNum.y + 5}" font-family="'Cinzel', serif" font-size="15" font-weight="bold" fill="#aa820a" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke fill">${((i - ascSignIdx + 12) % 12) + 1}</text>`;

        const pSym = polarToCart(cx, cy, 156, aMid);
        svg += `<svg x="${pSym.x - 17}" y="${pSym.y - 17}" width="34" height="34" viewBox="0 0 64 64" style="color: ${ELEMENT_SIGN_COLORS[SIGN_ELEMENTS[i]]};">${MONOLINE_ZODIAC_SVGS[i]}</svg>`;
      }

      for (let i = 0; i < 12; i++) {
        for (let d = 0; d < 12; d++) {
          const pt1 = polarToCart(cx, cy, R.SignSector, eclToScreenAngle((i * 30) + (d * 2.5), ascAbs));
          const pt2 = polarToCart(cx, cy, R.Dodec, eclToScreenAngle((i * 30) + (d * 2.5), ascAbs));
          svg += `<line x1="${pt1.x}" y1="${pt1.y}" x2="${pt2.x}" y2="${pt2.y}" stroke="rgba(170,130,10,0.3)" stroke-width="0.8"/>`;
          const pDod = polarToCart(cx, cy, (R.SignSector + R.Dodec) / 2, eclToScreenAngle((i * 30) + (d * 2.5) + 1.25, ascAbs));
          svg += `<svg x="${pDod.x - 5.5}" y="${pDod.y - 5.5}" width="11" height="11" viewBox="0 0 64 64" style="color: ${ELEMENT_SIGN_COLORS[SIGN_ELEMENTS[(i + d) % 12]]};">${MONOLINE_ZODIAC_SVGS[(i + d) % 12]}</svg>`;
        }
      }

      for (let s = 0; s < 12; s++) {
        let prev = 0;
        EGYPTIAN_TERMS[s].forEach(term => {
          const pt1 = polarToCart(cx, cy, R.Dodec, eclToScreenAngle((s * 30) + prev, ascAbs));
          const pt2 = polarToCart(cx, cy, R.Termos, eclToScreenAngle((s * 30) + prev, ascAbs));
          svg += `<line x1="${pt1.x}" y1="${pt1.y}" x2="${pt2.x}" y2="${pt2.y}" stroke="${goldColor}" stroke-width="1.2"/>`;
          const pTerm = polarToCart(cx, cy, (R.Dodec + R.Termos) / 2, eclToScreenAngle((s * 30) + (prev + term.deg) / 2, ascAbs));
          svg += `<text x="${pTerm.x}" y="${pTerm.y + 4}" font-size="10" font-weight="bold" fill="#103b70" text-anchor="middle">${term.p}</text>`;
          prev = term.deg;
        });
      }

      for (let deg = 0; deg < 360; deg++) {
        const aScreen = eclToScreenAngle(deg, ascAbs);
        const tickLen = (deg % 10 === 0) ? 12 : ((deg % 5 === 0) ? 8 : 4);
        const p1 = polarToCart(cx, cy, R.Termos, aScreen);
        const p2 = polarToCart(cx, cy, R.Termos + tickLen, aScreen);
        svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${goldColor}" stroke-width="${deg % 10 === 0 ? 1.5 : 0.8}"/>`;
      }

      const planetList = PLANETS_DEF.map(p => ({ ...p, deg: pObj[p.id].abs, retro: pObj[p.id].retro, aScreen: eclToScreenAngle(pObj[p.id].abs, ascAbs) }));
      planetList.sort((a, b) => a.aScreen - b.aScreen);

      planetList.forEach((p, idx) => {
        let usedLevels = new Set();
        for (let j = 0; j < planetList.length; j++) {
          if (idx !== j && angleDist(p.aScreen, planetList[j].aScreen) < 9.5) {
            if (planetList[j].level !== undefined) usedLevels.add(planetList[j].level);
          }
        }
        let lvl = 0;
        while (usedLevels.has(lvl)) lvl++;
        p.level = lvl;
      });

      planetList.forEach(p => {
        const pR = 295 + (p.level * 25);
        const p1 = polarToCart(cx, cy, R.Scale, p.aScreen);
        const p2 = polarToCart(cx, cy, pR - 10, p.aScreen);
        svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#1d5fa8" stroke-width="1.5"/>`;

        const pPos = polarToCart(cx, cy, pR, p.aScreen);
        let retroSymbol = p.retro ? `<tspan fill="#dc2626" font-weight="900"> ℞</tspan>` : '';

        svg += `<g transform="translate(${pPos.x}, ${pPos.y})">
          <text x="0" y="4" font-size="21" font-weight="bold" fill="#103b70" text-anchor="middle">${p.symbol}</text>
          <text x="0" y="19" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">${formatDegMin(p.deg)}${retroSymbol}</text>
        </g>`;
      });

      svg += `</svg>`;

      const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      const blobURL = URL.createObjectURL(svgBlob);

      const imgLoader = new Image();
      imgLoader.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 1920;
        canvas.height = 2300;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 1920, 2300);
        ctx.drawImage(imgLoader, 0, 0, 1920, 2300);

        lastRenderedPngUrl = canvas.toDataURL('image/png');
        container.innerHTML = `<img src="${lastRenderedPngUrl}" alt="Mandala Astrológica">`;
        URL.revokeObjectURL(blobURL);
      };
      imgLoader.src = blobURL;
    }

    function salvarImagemMandala() {
      if (!lastRenderedPngUrl) return;
      const link = document.createElement('a');
      link.download = `Astro_Hellenic_${currentSubjectName.replace(/\s+/g, '_')}.png`;
      link.href = lastRenderedPngUrl;
      link.click();
    }

    window.onload = function() {
      carregarPastasSalvas();
      carregarCeuDoMomento();
      carregarConteudoPastaAtual();
    };
</script>

</body>
</html>
