<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Hellenic</title>
    
    <!-- FONTES E ÍCONES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-sidebar: #ffffff;
            --primary-blue: #103b70;
            --gold-primary: #d4af37;
            --gold-dark: #9a6d18;
            --text-dark: #0f172a;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* PAINEL LATERAL */
        #sidebar {
            width: 320px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
        }

        .sidebar-title {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .menu-list {
            list-style: none;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-item {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s ease;
        }

        .menu-item:hover, .menu-item.active {
            background: #f1f5f9;
            color: var(--primary-blue);
        }

        .menu-item i {
            color: var(--gold-dark);
        }

        .favorites-section {
            padding: 12px 16px;
            flex: 1;
            overflow-y: auto;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-dark);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .client-search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
            outline: none;
        }

        /* ÁREA PRINCIPAL DA MANDALA */
        #main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            position: relative;
        }

        /* BARRA SUPERIOR MINIMALISTA */
        #top-bar {
            height: 48px;
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .top-bar-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--primary-blue);
            font-size: 16px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 4px;
            transition: background 0.15s ease;
        }

        .icon-btn:hover {
            background: #f1f5f9;
        }

        .time-stepper {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 2px;
        }

        .time-select {
            border: none;
            background: transparent;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            padding: 2px 6px;
            outline: none;
            cursor: pointer;
        }

        /* PALCO DA MANDALA (SEM BORDAS OU QUADRADOS SEPARADOS) */
        #mandala-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            background-color: #ffffff;
        }

        #mandala-container img {
            max-width: 100%;
            max-height: calc(100vh - 68px);
            width: auto;
            height: auto;
            display: block;
            border: none !important;
            box-shadow: none !important;
            filter: none !important;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: auto; }
        }
    </style>
</head>
<body>

        </div>

    </aside>

            <!-- NAVEGADOR TEMPORAL (STEPPER) -->
            <div class="time-stepper">

                <select id="stepUnit" class="time-select">

                    <option value="hour">Hora</option>
                    <option value="day">Dia</option>
                    <option value="month" selected>Mês</option>

        </div>

                Gerando mapa...

    function formatDegMin(absDeg) {
      const degInSign = absDeg % 30;
      const degrees = Math.floor(degInSign);
      const minutes = Math.round((degInSign - degrees) * 60);
      const minStr = minutes < 10 ? `0${minutes}` : `${minutes}`;
      return `${degrees}°${minStr}′`;
    }

    function eclToScreenAngle(eclDeg, ascAbs) {
      return (180 - (eclDeg - ascAbs) + 36000) % 360;
    }

    function polarToCart(cx, cy, r, angleDeg) {
      const rad = angleDeg * Math.PI / 180.0;
      return { x: cx + (r * Math.cos(rad)), y: cy + (r * Math.sin(rad)) };
    }

    function calculateSevenLots(ascAbs, isDay, planetObj) {
      const sun = planetObj.Sun.abs;
      const moon = planetObj.Moon.abs;
      const merc = planetObj.Mercury.abs;
      const ven = planetObj.Venus.abs;
      const mars = planetObj.Mars.abs;
      const jup = planetObj.Jupiter.abs;
      const sat = planetObj.Saturn.abs;

      const fortAbs = (isDay ? (ascAbs + moon - sun) : (ascAbs + sun - moon) + 36000) % 360;
      const spirAbs = (isDay ? (ascAbs + sun - moon) : (ascAbs + moon - sun) + 36000) % 360;
      const erosAbs = (isDay ? (ascAbs + ven - spirAbs) : (ascAbs + spirAbs - ven) + 36000) % 360;
      const necAbs = (isDay ? (ascAbs + fortAbs - merc) : (ascAbs + merc - fortAbs) + 36000) % 360;
      const courAbs = (isDay ? (ascAbs + fortAbs - mars) : (ascAbs + mars - fortAbs) + 36000) % 360;
      const vicAbs = (isDay ? (ascAbs + jup - spirAbs) : (ascAbs + spirAbs - jup) + 36000) % 360;
      const nemAbs = (isDay ? (ascAbs + fortAbs - sat) : (ascAbs + sat - fortAbs) + 36000) % 360;

      return [
        { label: "FORT", type: "fortune", deg: fortAbs },
        { label: "ESP", type: "spirit", deg: spirAbs },
        { label: "EROS", type: "venus", sym: "♀", deg: erosAbs },
        { label: "NEC", type: "mercury", sym: "☿", deg: necAbs },
        { label: "AUD", type: "mars", sym: "♂", deg: courAbs },
        { label: "VIT", type: "jupiter", sym: "♃", deg: vicAbs },
        { label: "NÊM", type: "saturn", sym: "♄", deg: nemAbs }
      ];
    }

    function angleDist(a1, a2) {
      let diff = Math.abs(a1 - a2) % 360;
      return diff > 180 ? 360 - diff : diff;
    }

    function getRadiusForLevel(level) {
      switch(level) {
        case 0: return 198;
        case 1: return 174;
        case 2: return 150;
        case 3: return 126;
        default: return 198 - (level * 24);
      }
    }

    /* BUSCA NOME DA CIDADE REAL VIA OPENSTREETMAP */
    async function obterNomeCidade(lat, lon) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`);
        const data = await res.json();
        const addr = data.address || {};
        const cidade = addr.city || addr.town || addr.village || addr.municipality || "Local Localizado";
        const estado = addr.state ? `, ${addr.state}` : "";
        return `${cidade}${estado}`;
      } catch (e) {
        return "Jacareí, SP";
      }
    }

    /* CARREGA CÊU DO MOMENTO */
    function carregarCeuDoMomento() {
      currentSubjectName = "Céu do Momento";
      currentMoment = new Date();

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const nomeCidade = await obterNomeCidade(lat, lon);
            currentGeo = { lat, lon, city: nomeCidade };
            executarCalculo();
          },
          () => {
            currentGeo = { lat: -23.5505, lon: -46.6333, city: "São Paulo, SP" };
            executarCalculo();
          },
          { timeout: 4000 }
        );
      } else {
        currentGeo = { lat: -23.5505, lon: -46.6333, city: "São Paulo, SP" };
        executarCalculo();
      }
    }

    /* AVANÇAR / VOLTAR TEMPO (STEPPER) */
    function ajustarTempo(direcao) {
      const unit = document.getElementById('stepUnit').value;
      const amount = direcao;

      switch(unit) {
        case 'second': currentMoment.setSeconds(currentMoment.getSeconds() + amount); break;
        case 'minute': currentMoment.setMinutes(currentMoment.getMinutes() + amount); break;
        case 'hour': currentMoment.setHours(currentMoment.getHours() + amount); break;
        case 'day': currentMoment.setDate(currentMoment.getDate() + amount); break;
        case 'month': currentMoment.setMonth(currentMoment.getMonth() + amount); break;
        case 'year': currentMoment.setFullYear(currentMoment.getFullYear() + amount); break;
      }

      executarCalculo();
    }

    /* REQUISIÇÃO API DA VERCEL */
    async function executarCalculo() {
      const ano = currentMoment.getFullYear();
      const mes = String(currentMoment.getMonth() + 1).padStart(2, '0');
      const dia = String(currentMoment.getDate()).padStart(2, '0');
      const dataStr = `${ano}-${mes}-${dia}`;

      const hora = String(currentMoment.getHours()).padStart(2, '0');
      const min = String(currentMoment.getMinutes()).padStart(2, '0');
      const horaStr = `${hora}:${min}`;

      try {
        const urlApi = `https://motor-astrologia.vercel.app/api/index?data=${dataStr}&hora=${horaStr}&fuso=-3&lat=${currentGeo.lat}&lon=${currentGeo.lon}`;
        const res = await fetch(urlApi);
        if (!res.ok) throw new Error("Erro na API");

        const apiJson = await res.json();

        const SIGNOS_INDEX = {
          "Aries": 0, "Touro": 1, "Gemeos": 2, "Cancer": 3,
          "Leao": 4, "Virgem": 5, "Libra": 6, "Escorpiao": 7,
          "Sagitario": 8, "Capricornio": 9, "Aquario": 10, "Peixes": 11
        };

        const planetas = apiJson.planetas || {};
        const ascData = apiJson.ascendente || {};
        const mcData = apiJson.meio_ceu || {};
        const sizigiaData = apiJson.sizigia || {};

        const ascAbs = ((SIGNOS_INDEX[ascData.signo] || 0) * 30) + (parseFloat(ascData.grau) || 0);
        const mcAbs = ((SIGNOS_INDEX[mcData.signo] || 0) * 30) + (parseFloat(mcData.grau) || 0);

        const checkRetro = (pObj) => {
          if (!pObj) return false;
          if (pObj.retrogrado !== undefined) return Boolean(pObj.retrogrado);
          if (pObj.velocidade !== undefined) return parseFloat(pObj.velocidade) < 0;
          return false;
        };

        currentCalculatedData = {
          Ascendente: { grau_absoluto: ascAbs },
          MC: { grau_absoluto: mcAbs },
          Nodo_Norte: { grau_absoluto: planetas.NodoNorte ? planetas.NodoNorte.grau_absoluto : 0, retro: checkRetro(planetas.NodoNorte) },
          Sizigia: { grau_absoluto: sizigiaData.grau_absoluto !== undefined ? parseFloat(sizigiaData.grau_absoluto) : 0 },
          Sol: { grau_absoluto: planetas.Sol ? planetas.Sol.grau_absoluto : 0, retro: false },
          Lua: { grau_absoluto: planetas.Lua ? planetas.Lua.grau_absoluto : 0, retro: false },
          Mercúrio: { grau_absoluto: planetas.Mercurio ? planetas.Mercurio.grau_absoluto : 0, retro: checkRetro(planetas.Mercurio) },
          Vênus: { grau_absoluto: planetas.Venus ? planetas.Venus.grau_absoluto : 0, retro: checkRetro(planetas.Venus) },
          Marte: { grau_absoluto: planetas.Marte ? planetas.Marte.grau_absoluto : 0, retro: checkRetro(planetas.Marte) },
          Júpiter: { grau_absoluto: planetas.Jupiter ? planetas.Jupiter.grau_absoluto : 0, retro: checkRetro(planetas.Jupiter) },
          Saturno: { grau_absoluto: planetas.Saturno ? planetas.Saturno.grau_absoluto : 0, retro: checkRetro(planetas.Saturno) }
        };

        renderMandala();

      } catch (err) {
        document.getElementById('mandala-container').innerHTML = `<p style="color: #dc2626;">Erro ao calcular posições.</p>`;
      }
    }

    /* DESENHA A MANDALA RADIAL E EMBUTE CABEÇALHO DENTRO DO PNG */
    function renderMandala() {
      const container = document.getElementById('mandala-container');
      if (!container || !currentCalculatedData) return;

      const data = currentCalculatedData;
      const ascAbs = data.Ascendente.grau_absoluto;
      const mcAbs = data.MC ? data.MC.grau_absoluto : (ascAbs + 270) % 360;
      const nodeAbs = data.Nodo_Norte ? data.Nodo_Norte.grau_absoluto : 0;
      const syzAbs = data.Sizigia ? data.Sizigia.grau_absoluto : 0;

      const pObj = {};
      PLANETS_DEF.forEach(p => {
        const item = data[p.key];
        pObj[p.id] = { abs: item ? item.grau_absoluto : 0, symbol: p.symbol, name: p.name, retro: item ? Boolean(item.retro) : false };
      });

      const isDay = ((pObj.Sun.abs - ascAbs + 360) % 360) >= 180;
      const sectText = isDay ? "• Natividade Diurna" : "• Natividade Noturna";

      const ano = currentMoment.getFullYear();
      const mes = String(currentMoment.getMonth() + 1).padStart(2, '0');
      const dia = String(currentMoment.getDate()).padStart(2, '0');
      const hora = String(currentMoment.getHours()).padStart(2, '0');
      const min = String(currentMoment.getMinutes()).padStart(2, '0');

      const size = 960, cx = 480, cy = 480;
      const R = { Aspects: 110, SignSector: 215, Dodec: 238, Termos: 262, Scale: 280 };
      const R_OuterLine = 399;
      const goldColor = "#c59b27";

      let svg = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
        <rect width="${size}" height="${size}" fill="#ffffff"/>`;

      // CABEÇALHO DISCRETO EMBUTIDO NA PRÓPRIA IMAGEM DO PNG
      svg += `<g id="png-discreet-header">
        <text x="35" y="52" font-family="'Cinzel', serif" font-size="22" font-weight="800" fill="#103b70">${currentSubjectName}</text>
        <text x="35" y="74" font-family="'Montserrat', sans-serif" font-size="13" font-weight="500" fill="#475569">${dia}/${mes}/${ano} às ${hora}:${min} • ${currentGeo.city}</text>
        <text x="35" y="92" font-family="'Montserrat', sans-serif" font-size="12" font-weight="500" fill="#64748b">Zodíaco Tropical • Signos Inteiros</text>
        <text x="35" y="110" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#9a6d18">${sectText}</text>
      </g>`;

      svg += `<circle cx="${cx}" cy="${cy}" r="${R.Aspects}" fill="#ffffff" stroke="${goldColor}" stroke-width="2"/>`;

      // ASPECTOS
      const occupiedSigns = new Set();
      PLANETS_DEF.forEach(p => { occupiedSigns.add(Math.floor(pObj[p.id].abs / 30)); });
      const occupiedArray = Array.from(occupiedSigns);
      for (let i = 0; i < occupiedArray.length; i++) {
        for (let j = i + 1; j < occupiedArray.length; j++) {
          let diff = Math.abs(occupiedArray[i] - occupiedArray[j]);
          if (diff > 6) diff = 12 - diff;
          let col = null;
          if (diff === 6) col = "#8b0000";
          else if (diff === 4) col = "#0b2545";
          else if (diff === 3) col = "#dc2626";
          else if (diff === 2) col = "#2563eb";

          if (col) {
            const pt1 = polarToCart(cx, cy, R.Aspects - 4, eclToScreenAngle(occupiedArray[i] * 30 + 15, ascAbs));
            const pt2 = polarToCart(cx, cy, R.Aspects - 4, eclToScreenAngle(occupiedArray[j] * 30 + 15, ascAbs));
            svg += `<line x1="${pt1.x}" y1="${pt1.y}" x2="${pt2.x}" y2="${pt2.y}" stroke="${col}" stroke-width="1.8" opacity="0.9"/>`;
          }
        }
      }

      // ANÉIS
      svg += `<circle cx="${cx}" cy="${cy}" r="${R.SignSector}" fill="none" stroke="${goldColor}" stroke-width="2"/>`;
      svg += `<circle cx="${cx}" cy="${cy}" r="${R.Dodec}" fill="none" stroke="${goldColor}" stroke-width="1.5"/>`;
      svg += `<circle cx="${cx}" cy="${cy}" r="${R.Termos}" fill="none" stroke="${goldColor}" stroke-width="2"/>`;
      svg += `<circle cx="${cx}" cy="${cy}" r="${R.Scale}" fill="none" stroke="${goldColor}" stroke-width="1.5"/>`;

      // EIXOS
      const ascPt = polarToCart(cx, cy, R_OuterLine, eclToScreenAngle(ascAbs, ascAbs));
      const dscPt = polarToCart(cx, cy, R_OuterLine, (eclToScreenAngle(ascAbs, ascAbs) + 180) % 360);
      svg += `<line x1="${ascPt.x}" y1="${ascPt.y}" x2="${dscPt.x}" y2="${dscPt.y}" stroke="#000000" stroke-width="2.5"/>`;

      const mcPt = polarToCart(cx, cy, R_OuterLine, eclToScreenAngle(mcAbs, ascAbs));
      const icPt = polarToCart(cx, cy, R_OuterLine, (eclToScreenAngle(mcAbs, ascAbs) + 180) % 360);
      svg += `<line x1="${mcPt.x}" y1="${mcPt.y}" x2="${icPt.x}" y2="${icPt.y}" stroke="#000000" stroke-width="2.5"/>`;

      // LINHAS DE SIGNOS
      for (let i = 0; i < 12; i++) {
        const pt1 = polarToCart(cx, cy, R.Aspects, eclToScreenAngle(i * 30, ascAbs));
        const pt2 = polarToCart(cx, cy, R_OuterLine, eclToScreenAngle(i * 30, ascAbs));
        svg += `<line x1="${pt1.x}" y1="${pt1.y}" x2="${pt2.x}" y2="${pt2.y}" stroke="${goldColor}" stroke-width="1.8"/>`;
      }

      // ELEMENTOS INTERNOS (PRESERVANDO 100% O ÍCONE DA SÍZIGIA)
      const allRingItems = [
        { label: "ASC", deg: ascAbs, color: "#000000", itemType: "axis" },
        { label: "DSC", deg: (ascAbs + 180) % 360, color: "#000000", itemType: "axis" },
        { label: "MC", deg: mcAbs, color: "#000000", itemType: "axis" },
        { label: "IC", deg: (mcAbs + 180) % 360, color: "#000000", itemType: "axis" }
      ];

      if (nodeAbs > 0) {
        allRingItems.push({ label: "☊", deg: nodeAbs, color: "#0d9488", itemType: "node" });
        allRingItems.push({ label: "☋", deg: (nodeAbs + 180) % 360, color: "#0d9488", itemType: "node" });
      }
      if (syzAbs > 0) {
        allRingItems.push({ label: "SIZ", deg: syzAbs, color: "#103b70", itemType: "syzygy" });
      }

      const lotes = calculateSevenLots(ascAbs, isDay, pObj);
      lotes.forEach(lot => {
        allRingItems.push({ label: lot.label, deg: lot.deg, color: goldColor, itemType: "lot", lotType: lot.type, sym: lot.sym });
      });

      allRingItems.forEach(item => item.aScreen = eclToScreenAngle(item.deg, ascAbs));
      allRingItems.sort((a, b) => a.aScreen - b.aScreen);

      allRingItems.forEach((item, idx) => {
        let usedLevels = new Set();
        for (let j = 0; j < allRingItems.length; j++) {
          if (idx !== j && angleDist(item.aScreen, allRingItems[j].aScreen) < 10.5) {
            if (allRingItems[j].level !== undefined) usedLevels.add(allRingItems[j].level);
          }
        }
        let lvl = 0;
        while (usedLevels.has(lvl)) lvl++;
        item.level = lvl;
      });

      allRingItems.forEach(item => {
        if (item.itemType !== "axis") {
          const itemR = getRadiusForLevel(item.level);
          const p1 = polarToCart(cx, cy, itemR + 12, item.aScreen);
          const p2 = polarToCart(cx, cy, R.SignSector, item.aScreen);
          svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${item.itemType === 'lot' ? goldColor : item.color}" stroke-width="1.5"/>`;
        }

        const itemR = getRadiusForLevel(item.level);
        const pTxt = polarToCart(cx, cy, itemR, item.aScreen);

        if (item.itemType === "syzygy") {
          svg += `<g transform="translate(${pTxt.x}, ${pTxt.y})">
            <circle cx="0" cy="0" r="12" fill="#ffffff" stroke="none"/>
            <circle cx="0" cy="0" r="10" stroke="${item.color}" stroke-width="1.8" fill="none"/>
            <path d="M 0 -10 A 10 10 0 0 1 0 10 Q 3.8 -3.8 -3.8 -10 Z" fill="${item.color}"/>
            <circle cx="0" cy="0" r="2.3" fill="${item.color}"/>
            <text x="0" y="21" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">${formatDegMin(item.deg)}</text>
          </g>`;
        } else if (item.itemType === "node") {
          svg += `<g transform="translate(${pTxt.x}, ${pTxt.y})">
            <text x="0" y="5" font-size="24" font-weight="bold" fill="${item.color}" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke fill">${item.label}</text>
            <text x="0" y="19" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">${formatDegMin(item.deg)}</text>
          </g>`;
        } else if (item.itemType === "axis") {
          svg += `<g transform="translate(${pTxt.x}, ${pTxt.y})">
            <rect x="-22" y="-12" width="44" height="24" rx="5" fill="#ffffff" stroke="${item.color}" stroke-width="1.8"/>
            <text x="0" y="4" font-size="14" font-weight="900" fill="${item.color}" text-anchor="middle">${item.label}</text>
            <text x="0" y="21" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">${formatDegMin(item.deg)}</text>
          </g>`;
        } else if (item.itemType === "lot") {
          svg += `<g transform="translate(${pTxt.x}, ${pTxt.y})">`;
          if (item.lotType === "fortune") {
            svg += `<circle cx="0" cy="0" r="10" fill="#ffffff" stroke="#103b70" stroke-width="1.5"/><line x1="-7" y1="-7" x2="7" y2="7" stroke="#103b70" stroke-width="1.5"/><line x1="7" y1="-7" x2="-7" y2="7" stroke="#103b70" stroke-width="1.5"/>`;
          } else if (item.lotType === "spirit") {
            svg += `<text x="0" y="6" font-size="24" fill="#103b70" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">&#x03C6;</text>`;
          } else {
            svg += `<circle cx="0" cy="0" r="10" fill="#ffffff" stroke="#103b70" stroke-width="1.5"/><text x="0" y="4" font-size="11" font-weight="bold" fill="#103b70" text-anchor="middle">${item.sym}</text>`;
          }
          svg += `<text x="0" y="17" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">${formatDegMin(item.deg)}</text></g>`;
        }
      });

      // CASAS E SIGNOS
      const ascSignIdx = Math.floor(ascAbs / 30);
      for (let i = 0; i < 12; i++) {
        const aMid = eclToScreenAngle((i * 30) + 15, ascAbs);
        const pNum = polarToCart(cx, cy, 122, aMid);
        svg += `<text x="${pNum.x}" y="${pNum.y + 5}" font-family="'Cinzel', serif" font-size="15" font-weight="bold" fill="#aa820a" text-anchor="middle" stroke="#ffffff" stroke-width="4" paint-order="stroke fill">${((i - ascSignIdx + 12) % 12) + 1}</text>`;

        const pSym = polarToCart(cx, cy, 156, aMid);
        svg += `<svg x="${pSym.x - 17}" y="${pSym.y - 17}" width="34" height="34" viewBox="0 0 64 64" style="color: ${ELEMENT_SIGN_COLORS[SIGN_ELEMENTS[i]]};">${MONOLINE_ZODIAC_SVGS[i]}</svg>`;
      }

      // DODECATEMÓRIA E TERMOS
      for (let i = 0; i < 12; i++) {
        for (let d = 0; d < 12; d++) {
          const pt1 = polarToCart(cx, cy, R.SignSector, eclToScreenAngle((i * 30) + (d * 2.5), ascAbs));
          const pt2 = polarToCart(cx, cy, R.Dodec, eclToScreenAngle((i * 30) + (d * 2.5), ascAbs));
          svg += `<line x1="${pt1.x}" y1="${pt1.y}" x2="${pt2.x}" y2="${pt2.y}" stroke="rgba(170,130,10,0.3)" stroke-width="0.8"/>`;
          const pDod = polarToCart(cx, cy, (R.SignSector + R.Dodec) / 2, eclToScreenAngle((i * 30) + (d * 2.5) + 1.25, ascAbs));
          svg += `<svg x="${pDod.x - 5.5}" y="${pDod.y - 5.5}" width="11" height="11" viewBox="0 0 64 64" style="color: ${ELEMENT_SIGN_COLORS[SIGN_ELEMENTS[(i + d) % 12]]};">${MONOLINE_ZODIAC_SVGS[(i + d) % 12]}</svg>`;
        }
      }

      for (let s = 0; s < 12; s++) {
        let prev = 0;
        EGYPTIAN_TERMS[s].forEach(term => {
          const pt1 = polarToCart(cx, cy, R.Dodec, eclToScreenAngle((s * 30) + prev, ascAbs));
          const pt2 = polarToCart(cx, cy, R.Termos, eclToScreenAngle((s * 30) + prev, ascAbs));
          svg += `<line x1="${pt1.x}" y1="${pt1.y}" x2="${pt2.x}" y2="${pt2.y}" stroke="${goldColor}" stroke-width="1.2"/>`;
          const pTerm = polarToCart(cx, cy, (R.Dodec + R.Termos) / 2, eclToScreenAngle((s * 30) + (prev + term.deg) / 2, ascAbs));
          svg += `<text x="${pTerm.x}" y="${pTerm.y + 4}" font-size="10" font-weight="bold" fill="#103b70" text-anchor="middle">${term.p}</text>`;
          prev = term.deg;
        });
      }

      for (let deg = 0; deg < 360; deg++) {
        const aScreen = eclToScreenAngle(deg, ascAbs);
        const tickLen = (deg % 10 === 0) ? 12 : ((deg % 5 === 0) ? 8 : 4);
        const p1 = polarToCart(cx, cy, R.Termos, aScreen);
        const p2 = polarToCart(cx, cy, R.Termos + tickLen, aScreen);
        svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${goldColor}" stroke-width="${deg % 10 === 0 ? 1.5 : 0.8}"/>`;
      }

      // PLANETAS
      const planetList = PLANETS_DEF.map(p => ({ ...p, deg: pObj[p.id].abs, retro: pObj[p.id].retro, aScreen: eclToScreenAngle(pObj[p.id].abs, ascAbs) }));
      planetList.sort((a, b) => a.aScreen - b.aScreen);

      planetList.forEach((p, idx) => {
        let usedLevels = new Set();
        for (let j = 0; j < planetList.length; j++) {
          if (idx !== j && angleDist(p.aScreen, planetList[j].aScreen) < 9.5) {
            if (planetList[j].level !== undefined) usedLevels.add(planetList[j].level);
          }
        }
        let lvl = 0;
        while (usedLevels.has(lvl)) lvl++;
        p.level = lvl;
      });

      planetList.forEach(p => {
        const pR = 295 + (p.level * 25);
        const p1 = polarToCart(cx, cy, R.Scale, p.aScreen);
        const p2 = polarToCart(cx, cy, pR - 10, p.aScreen);
        svg += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#1d5fa8" stroke-width="1.5"/>`;

        const pPos = polarToCart(cx, cy, pR, p.aScreen);
        let retroSymbol = p.retro ? `<tspan fill="#dc2626" font-weight="900"> ℞</tspan>` : '';

        svg += `<g transform="translate(${pPos.x}, ${pPos.y})">
          <text x="0" y="4" font-size="21" font-weight="bold" fill="#103b70" text-anchor="middle">${p.symbol}</text>
          <text x="0" y="19" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">${formatDegMin(p.deg)}${retroSymbol}</text>
        </g>`;
      });

      svg += `</svg>`;

      const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
      const blobURL = URL.createObjectURL(svgBlob);

      const imgLoader = new Image();
      imgLoader.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = 1920;
        canvas.height = 1920;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 1920, 1920);
        ctx.drawImage(imgLoader, 0, 0, 1920, 1920);

        lastRenderedPngUrl = canvas.toDataURL('image/png');
        container.innerHTML = `<img src="${lastRenderedPngUrl}" alt="Mandala Astrológica">`;
        URL.revokeObjectURL(blobURL);
      };
      imgLoader.src = blobURL;
    }

    /* SALVAR IMAGEM */
    function salvarImagemMandala() {
      if (!lastRenderedPngUrl) return;
      const link = document.createElement('a');
      link.download = `Astro_Hellenic_${currentSubjectName.replace(/\s+/g, '_')}.png`;
      link.href = lastRenderedPngUrl;
      link.click();
    }

    /* AÇÕES DE MENU */
    function abrirNovoMapa() {
      const nome = prompt("Nome do Nativo:");
      if (!nome) return;
      const data = prompt("Data de Nascimento (YYYY-MM-DD ou DD/MM/YYYY):");
      if (!data) return;
      const hora = prompt("Horário (HH:MM):", "12:00");
      
      currentSubjectName = nome;
      const pData = data.includes('/') ? data.split('/').reverse().join('-') : data;
      const [ano, mes, dia] = pData.split('-');
      const [h, m] = hora.split(':');

      currentMoment = new Date(ano, mes - 1, dia, h, m);
      executarCalculo();
    }

      // Reservado para integração com planilha
    }

    window.onload = carregarCeuDoMomento;
