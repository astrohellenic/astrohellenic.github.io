<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="temas.css?v=20261009c">
    <link rel="stylesheet" href="papiro.css?v=20261010c">
    <link rel="stylesheet" href="componentes.css?v=20261010h">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Agendar Atendimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="publico.css?v=20261010c">
</head>
<body>
<div class="form-card painel">
  <div id="formLogoContainer" style="text-align: center; margin-bottom: 20px;">
    <img id="formLogoImg" src="" alt="Logo" style="max-height: 75px; max-width: 100%; display: none; margin: 0 auto;" />
  </div>
  <h2>Escolha seu horário</h2>
  <div id="avisoTeste" class="sub" style="display:none;color:#a03e25;font-weight:700">MODO DE TESTE — nada será gravado</div>
  <div id="conteudo"><div class="vazio">Carregando horários...</div></div>
</div>
<div class="form-powered-by">powered by Astro Hellenic</div>

<script>
  const SUPABASE_URL = "https://ndgjenvddkmztmdixjhc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VTjldgs8Hv1RODaMg7T57Q_ISzbnm5C";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const params = new URLSearchParams(window.location.search);
  const ownerId = params.get('u');
  const clienteId = params.get('c');
  const modoTeste = params.get('teste') === '1'; // abre tudo igual, mas NÃO grava nada
  const DIAS_A_FRENTE = 45;
  // Serviço (Vercel) que fala com a Google Agenda do astrólogo — ver api/agenda-google.js
  const GOOGLE_AGENDA_API = 'https://astrohellenicgithubio.vercel.app/api/agenda-google';
  async function chamarGoogleAgenda(corpo) {
    const r = await fetch(GOOGLE_AGENDA_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    let j = null; try { j = await r.json(); } catch (e) { /* resposta sem JSON */ }
    return { http: r.status, json: j };
  }
  const ANTECEDENCIA_MIN = 120; // não oferece horário que começa em menos de 2h
  const SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  let agenda = null, diaEscolhido = null, horaEscolhida = null;

  const el = id => document.getElementById(id);
  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dataBR = iso => iso.split('-').reverse().join('/');

  /* "agora" no horário de Brasília, que é o fuso da agenda */
  function agoraBrasilia() {
    const p = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
      .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
    return { dataISO: `${p.year}-${p.month}-${p.day}`, minutos: parseInt(p.hour, 10) * 60 + parseInt(p.minute, 10) };
  }
  function somarDias(iso, n) {
    const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  const hhmmParaMin = h => { const [a, b] = h.slice(0, 5).split(':').map(Number); return a * 60 + b; };
  const minParaHHMM = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

  /* mesma regra da agenda do astrólogo: cada regra do dia da semana vira horários de duração + intervalo, sem colidir com os já marcados */
  function horariosLivres(dataISO) {
    const diaSemana = new Date(dataISO + 'T12:00:00Z').getUTCDay();
    const regras = agenda.disponibilidade.filter(r => r.dia_semana === diaSemana);
    const ocupados = agenda.ocupados.filter(o => o.data === dataISO).map(o => [hhmmParaMin(o.hora_inicio), hhmmParaMin(o.hora_fim)]);
    const dur = agenda.duracao, inter = agenda.intervalo;
    const agora = agoraBrasilia();
    const minimo = dataISO === agora.dataISO ? agora.minutos + ANTECEDENCIA_MIN : (dataISO < agora.dataISO ? 99999 : -1);
    const out = [];
    regras.forEach(r => {
      let m = hhmmParaMin(r.hora_inicio); const fim = hhmmParaMin(r.hora_fim);
      while (m + dur <= fim) {
        const sobrepoe = ocupados.some(([oi, of_]) => m < of_ && oi < m + dur);
        if (!sobrepoe && m >= minimo) out.push(minParaHHMM(m));
        m += dur + inter;
      }
    });
    return out.sort();
  }

  function desenhar() {
    const agora = agoraBrasilia();
    const dias = [];
    for (let i = 0; i < DIAS_A_FRENTE; i++) {
      const iso = somarDias(agora.dataISO, i);
      if (horariosLivres(iso).length) dias.push(iso);
    }
    if (!dias.length) { el('conteudo').innerHTML = '<div class="vazio">Não há horários disponíveis no momento. Entre em contato para combinarmos.</div>'; return; }
    if (!diaEscolhido || !dias.includes(diaEscolhido)) { diaEscolhido = dias[0]; horaEscolhida = null; }
    const nome = agenda.cliente_nome ? esc(agenda.cliente_nome.split(' ')[0]) : '';
    let h = (nome ? `<div class="sub">Olá, ${nome}! Escolha o dia e o horário do seu atendimento.<br>Horário de Brasília · duração de ${agenda.duracao} min</div>` : `<div class="sub">Horário de Brasília · duração de ${agenda.duracao} min</div>`);
    h += '<div class="titulo-sec">Dia</div><div class="dias">' + dias.map(iso => {
      const d = new Date(iso + 'T12:00:00Z');
      return `<button type="button" class="dia-btn${iso === diaEscolhido ? ' sel' : ''}" data-dia="${iso}"><small>${SEMANA[d.getUTCDay()]}</small>${iso.slice(8)}/${iso.slice(5, 7)}</button>`;
    }).join('') + '</div>';
    h += '<div class="titulo-sec">Horário</div><div class="horas">' + horariosLivres(diaEscolhido).map(hr =>
      `<button type="button" class="hora-btn${hr === horaEscolhida ? ' sel' : ''}" data-hora="${hr}">${hr}</button>`).join('') + '</div>';
    h += `<button type="button" class="btn-submit" id="btnConfirmar" ${horaEscolhida ? '' : 'disabled style="opacity:.5;cursor:default"'}>Confirmar horário</button>`;
    el('conteudo').innerHTML = h;
    el('conteudo').querySelectorAll('.dia-btn').forEach(b => b.onclick = () => { diaEscolhido = b.dataset.dia; horaEscolhida = null; desenhar(); });
    el('conteudo').querySelectorAll('.hora-btn').forEach(b => b.onclick = () => { horaEscolhida = b.dataset.hora; desenhar(); });
    const btn = el('btnConfirmar'); if (btn && horaEscolhida) btn.onclick = confirmar;
  }

  async function confirmar() {
    const btn = el('btnConfirmar'); btn.disabled = true; btn.innerText = 'Confirmando...';
    if (modoTeste) {
      el('conteudo').innerHTML = `<div class="msg-ok"><strong>Teste concluído!</strong><br>Escolheu ${dataBR(diaEscolhido)} às ${horaEscolhida}.<br><br>Nada foi gravado.</div>`;
      return;
    }
    // 1) confere na Google Agenda e já reserva o horário lá; 2) grava no sistema; se o 2º falhar, desfaz o 1º
    let evento;
    try { evento = await chamarGoogleAgenda({ acao: 'criar', u: ownerId, c: clienteId, data: diaEscolhido, hora: horaEscolhida }); }
    catch (e) { evento = null; }
    if (!evento || !evento.json || evento.json.ok !== true) {
      alert(evento && evento.json && evento.json.erro ? evento.json.erro : 'Não foi possível confirmar agora. Tente de novo em instantes.');
      await carregar();
      return;
    }
    const { data, error } = await supabaseClient.rpc('reservar_horario_agenda', { p_user: ownerId, p_mapa: clienteId, p_data: diaEscolhido, p_hora: horaEscolhida });
    if (error || !data || data.ok !== true) {
      try { await chamarGoogleAgenda({ acao: 'apagar', c: clienteId, eventId: evento.json.eventId }); } catch (e) { /* o astrólogo vê na agenda */ }
      const motivo = data && data.erro ? data.erro : 'Não foi possível confirmar. Tente outro horário.';
      alert(motivo);
      await carregar();
      return;
    }
    el('conteudo').innerHTML = `<div class="msg-ok"><strong>Horário confirmado!</strong><br>${dataBR(diaEscolhido)} às ${horaEscolhida} (horário de Brasília).<br><br>Você pode fechar esta página.</div>`;
  }

  async function carregar() {
    if (!ownerId || !clienteId) { el('conteudo').innerHTML = '<div class="vazio">Link inválido. Volte ao formulário e envie seus dados novamente.</div>'; return; }
    const { data, error } = await supabaseClient.rpc('agenda_publica', { p_user: ownerId, p_mapa: clienteId });
    if (error || !data) { el('conteudo').innerHTML = '<div class="vazio">Link inválido ou expirado. Volte ao formulário e envie seus dados novamente.</div>'; return; }
    agenda = data;
    if (agenda.ja_agendado) {
      el('conteudo').innerHTML = `<div class="msg-ok"><strong>Você já tem um horário marcado.</strong><br>${dataBR(agenda.ja_agendado.data)} às ${agenda.ja_agendado.hora_inicio.slice(0, 5)} (horário de Brasília).</div>`;
      return;
    }
    // Horários em que a Google Agenda do astrólogo já está ocupada entram na mesma lista de "ocupados".
    // Se não der pra consultar, não mostra horário nenhum (melhor do que oferecer um horário que pode estar ocupado).
    try {
      const hoje = agoraBrasilia().dataISO;
      const g = await chamarGoogleAgenda({ acao: 'ocupados', de: hoje, ate: somarDias(hoje, DIAS_A_FRENTE) });
      if (!g.json || g.json.ok !== true) throw new Error('google');
      agenda.ocupados = (agenda.ocupados || []).concat(g.json.ocupados);
    } catch (e) {
      el('conteudo').innerHTML = '<div class="vazio">Não foi possível carregar os horários agora. Tente de novo em instantes.</div>';
      return;
    }
    horaEscolhida = null;
    desenhar();
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const { data: cfg } = await supabaseClient.rpc('config_publica_formulario', { p_user: ownerId });
      const c = Array.isArray(cfg) ? cfg[0] : cfg;
      if (c && c.logo_url) { const i = el('formLogoImg'); i.src = c.logo_url.split('?')[0] + '?t=' + Date.now(); i.style.display = 'block'; }
      if (c && c.formulario_tema === 'ceu') document.body.classList.add('tema-ceu');
    } catch (e) { /* sem logo/tema, segue */ }
    if (modoTeste) el('avisoTeste').style.display = 'block';
    carregar();
  });
</script>
</body>
</html>
