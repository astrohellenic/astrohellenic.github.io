<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="papiro.css?v=20261005a">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Agendar Atendimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #fffdf5;
      --card-bg: #ffffff;
      --primary-blue: #103b70;
      --gold: #c59b27;
      --gold-hover: #a8821e;
      --border-color: #e2d9c2;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      gap: 16px;
    }

    /* Igual ao rodapé da capa dos relatórios (ver .rel-powered-by em relatorio.js) */
    .form-powered-by {
      font-size: 9px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .form-card { 
      background: var(--card-bg); 
      padding: 32px 28px; 
      border-radius: 14px; 
      box-shadow: 0 4px 20px rgba(197, 155, 39, 0.08); 
      width: 100%; 
      max-width: 440px; 
      border: 1.5px solid var(--gold); 
      position: relative; 
    }

    h2 { 
      margin: 0 0 24px 0; 
      font-family: 'Cinzel', serif;
      font-size: 20px; 
      font-weight: 700;
      color: var(--primary-blue); 
      text-align: center; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group { 
      margin-bottom: 16px; 
      position: relative; 
    }

    label { 
      display: block; 
      font-size: 11px; 
      font-weight: 700; 
      color: var(--primary-blue); 
      margin-bottom: 6px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
    }

    input { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid var(--border-color); 
      border-radius: 8px; 
      font-size: 14px; 
      font-family: 'Montserrat', sans-serif;
      background: #ffffff;
      color: var(--text-main);
      outline: none; 
      transition: all 0.2s ease;
    }

    input:focus { 
      border-color: var(--gold); 
      box-shadow: 0 0 0 3px rgba(197, 155, 39, 0.15);
    }

    .row { 
      display: flex; 
      gap: 12px; 
    }

    .row .form-group { 
      flex: 1; 
    }

    .btn-submit { 
      width: 100%; 
      background: var(--primary-blue); 
      color: #fcf6ba; 
      border: 1px solid var(--gold); 
      padding: 14px; 
      border-radius: 8px; 
      font-family: 'Cinzel', serif;
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: 12px; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(16, 59, 112, 0.15);
    }

    .btn-submit:hover {
      background: #0d2f5a;
      border-color: #fcf6ba;
    }

    /* Autocomplete de Cidade */
    .city-results { 
      position: absolute; 
      top: 100%; 
      left: 0; 
      right: 0; 
      background: #ffffff; 
      border: 1px solid var(--gold); 
      border-radius: 8px; 
      max-height: 180px; 
      overflow-y: auto; 
      z-index: 1000; 
      box-shadow: 0 6px 16px rgba(0,0,0,0.12); 
      display: none; 
      margin-top: 4px;
    }

    .city-item { 
      padding: 10px 12px; 
      font-size: 13px; 
      border-bottom: 1px solid #f1f5f9; 
      cursor: pointer; 
      color: var(--text-main);
    }

    .city-item:hover { 
      background: var(--bg-main); 
      color: var(--primary-blue); 
      font-weight: 600;
    }

    /* Modal de Confirmação */
    .modal-overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      background: rgba(16, 59, 112, 0.5); 
      backdrop-filter: blur(2px);
      display: none; 
      justify-content: center; 
      align-items: center; 
      z-index: 9999; 
      padding: 20px; 
    }

    .modal-card { 
      background: var(--card-bg); 
      padding: 28px; 
      border-radius: 14px; 
      width: 100%; 
      max-width: 420px; 
      border: 1.5px solid var(--gold);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
    }

    .modal-card h3 { 
      margin: 0 0 20px 0; 
      font-family: 'Cinzel', serif;
      color: var(--primary-blue); 
      font-size: 17px; 
      font-weight: 700;
      text-align: center; 
      text-transform: uppercase;
    }

    .summary-list { 
      font-size: 13px; 
      color: var(--text-main); 
      margin-bottom: 24px; 
      line-height: 1.6; 
    }

    .summary-item { 
      margin-bottom: 10px; 
      border-bottom: 1px solid #f1f5f9; 
      padding-bottom: 6px; 
    }

    .summary-item strong { 
      color: var(--primary-blue); 
      font-size: 11px; 
      text-transform: uppercase; 
      display: block; 
      letter-spacing: 0.5px;
    }

    .modal-actions { 
      display: flex; 
      gap: 12px; 
    }

    .btn-secondary { 
      flex: 1; 
      background: #ffffff; 
      color: var(--primary-blue); 
      border: 1px solid var(--border-color); 
      padding: 12px; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 13px;
      cursor: pointer; 
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--bg-main);
      border-color: var(--gold);
    }

    .btn-primary { 
      flex: 1; 
      background: var(--primary-blue); 
      color: #fcf6ba; 
      border: 1px solid var(--gold); 
      padding: 12px; 
      border-radius: 8px; 
      font-family: 'Cinzel', serif;
      font-weight: 700; 
      font-size: 13px;
      cursor: pointer; 
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: #0d2f5a;
    }

    /* TEMA CÉU (opcional, escolhido nas configurações de captação): céu à noite atrás, papiro e tinta na frente. */
    body.tema-ceu {
      background-color: #070d25;
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(40, 80, 160, 0.45) 0%, transparent 60%),
        radial-gradient(1.2px 1.2px at 12% 18%, #dfe8ff 50%, transparent 51%),
        radial-gradient(1.6px 1.6px at 78% 12%, #f6e7b4 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 34% 62%, #ffffff 50%, transparent 51%),
        radial-gradient(1.4px 1.4px at 88% 70%, #dfe8ff 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 6% 84%, #f6e7b4 50%, transparent 51%),
        radial-gradient(1.6px 1.6px at 56% 90%, #ffffff 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 66% 40%, #dfe8ff 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 22% 38%, #ffffff 50%, transparent 51%);
      background-attachment: fixed;
    }
    body.tema-ceu .form-powered-by { color: #9fb0d8; }
    body.tema-ceu .form-card, body.tema-ceu .modal-card {
      border: none; box-shadow: none; color: #1a1410;
      background: var(--papiro-fundo);
      clip-path: polygon(0 4px, 6% 0, 15% 3px, 27% 0, 38% 4px, 50% 1px, 63% 4px, 75% 0, 88% 3px, 95% 0, 100% 4px, calc(100% - 3px) 12%, 100% 30%, calc(100% - 4px) 52%, 100% 74%, calc(100% - 3px) 90%, 100% calc(100% - 4px), 93% calc(100% - 1px), 82% 100%, 70% calc(100% - 4px), 57% calc(100% - 1px), 45% 100%, 33% calc(100% - 4px), 20% calc(100% - 1px), 9% 100%, 0 calc(100% - 4px), 4px 85%, 0 62%, 3px 40%, 0 18%);
    }
    body.tema-ceu h2, body.tema-ceu .modal-card h3, body.tema-ceu label, body.tema-ceu .summary-item strong { color: #1d3a66; }
    body.tema-ceu input { background: transparent; border: 1.5px solid #1d3a66; color: #1a1410; border-radius: 6px; }
    body.tema-ceu input::placeholder { color: rgba(26, 20, 16, 0.5); }
    body.tema-ceu input:focus { border-color: #a03e25; box-shadow: none; }
    body.tema-ceu .btn-submit, body.tema-ceu .btn-primary {
      background: transparent; color: #a03e25; border: 1.5px solid #a03e25; box-shadow: none;
    }
    body.tema-ceu .btn-submit:hover, body.tema-ceu .btn-primary:hover { background: rgba(160, 62, 37, 0.12); border-color: #a03e25; }
    body.tema-ceu .btn-secondary { background: transparent; color: #1d3a66; border: 1.5px solid #1d3a66; }
    body.tema-ceu .btn-secondary:hover { background: rgba(29, 58, 102, 0.1); border-color: #1d3a66; }
    body.tema-ceu .summary-list, body.tema-ceu .summary-item { color: #1a1410; border-color: rgba(95, 65, 30, 0.4); }
    body.tema-ceu .modal-overlay { background: rgba(7, 13, 37, 0.7); }
    body.tema-ceu .city-results { background: var(--papiro-gradiente); border: 1.5px solid #1d3a66; }
    body.tema-ceu .city-item { color: #1a1410; border-color: rgba(95, 65, 30, 0.3); }
    body.tema-ceu .city-item:hover { background: rgba(29, 58, 102, 0.12); color: #1d3a66; }
  
    .dias { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; margin-bottom: 18px; }
    .dia-btn, .hora-btn { padding: 8px 4px; border: 1px solid var(--border-color); border-radius: 8px; background: #fff; color: var(--primary-blue);
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center; line-height: 1.25; }
    .dia-btn small { display: block; font-size: 10px; font-weight: 600; text-transform: uppercase; opacity: .75; }
    .dia-btn.sel, .hora-btn.sel { background: var(--primary-blue); color: #fcf6ba; border-color: var(--gold); }
    .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; margin-bottom: 18px; }
    .sub { font-size: 12px; color: var(--text-muted); text-align: center; margin: -12px 0 18px; line-height: 1.5; }
    .vazio { font-size: 13px; color: var(--text-muted); text-align: center; padding: 10px 0 18px; }
    .titulo-sec { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--primary-blue); margin-bottom: 8px; }
    .msg-ok { text-align: center; font-size: 14px; line-height: 1.6; }
    body.tema-ceu .dia-btn, body.tema-ceu .hora-btn { background: transparent; border: 1.5px solid #1d3a66; color: #1d3a66; }
    body.tema-ceu .dia-btn.sel, body.tema-ceu .hora-btn.sel { background: rgba(160, 62, 37, 0.12); border-color: #a03e25; color: #a03e25; }
    body.tema-ceu .sub, body.tema-ceu .vazio, body.tema-ceu .msg-ok { color: #1a1410; }
    body.tema-ceu .titulo-sec { color: #1d3a66; }
  </style>
</head>
<body>
<div class="form-card">
  <div id="formLogoContainer" style="text-align: center; margin-bottom: 20px;">
    <img id="formLogoImg" src="" alt="Logo" style="max-height: 75px; max-width: 100%; display: none; margin: 0 auto;" />
  </div>
  <h2>Escolha seu horário</h2>
  <div id="avisoTeste" class="sub" style="display:none;color:#a03e25;font-weight:700">MODO DE TESTE — nada será gravado</div>
  <div id="conteudo"><div class="vazio">Carregando horários...</div></div>
</div>
<div class="form-powered-by">powered by Astro Hellenic</div>

<script>
  const SUPABASE_URL = "https://ndgjenvddkmztmdixjhc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_VTjldgs8Hv1RODaMg7T57Q_ISzbnm5C";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const params = new URLSearchParams(window.location.search);
  const ownerId = params.get('u');
  const clienteId = params.get('c');
  const modoTeste = params.get('teste') === '1'; // abre tudo igual, mas NÃO grava nada
  const DIAS_A_FRENTE = 45;
  const ANTECEDENCIA_MIN = 120; // não oferece horário que começa em menos de 2h
  const SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  let agenda = null, diaEscolhido = null, horaEscolhida = null;

  const el = id => document.getElementById(id);
  const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dataBR = iso => iso.split('-').reverse().join('/');

  /* "agora" no horário de Brasília, que é o fuso da agenda */
  function agoraBrasilia() {
    const p = {};
    new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
      .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
    return { dataISO: `${p.year}-${p.month}-${p.day}`, minutos: parseInt(p.hour, 10) * 60 + parseInt(p.minute, 10) };
  }
  function somarDias(iso, n) {
    const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  const hhmmParaMin = h => { const [a, b] = h.slice(0, 5).split(':').map(Number); return a * 60 + b; };
  const minParaHHMM = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

  /* mesma regra da agenda do astrólogo: cada regra do dia da semana vira horários de duração + intervalo, sem colidir com os já marcados */
  function horariosLivres(dataISO) {
    const diaSemana = new Date(dataISO + 'T12:00:00Z').getUTCDay();
    const regras = agenda.disponibilidade.filter(r => r.dia_semana === diaSemana);
    const ocupados = agenda.ocupados.filter(o => o.data === dataISO).map(o => [hhmmParaMin(o.hora_inicio), hhmmParaMin(o.hora_fim)]);
    const dur = agenda.duracao, inter = agenda.intervalo;
    const agora = agoraBrasilia();
    const minimo = dataISO === agora.dataISO ? agora.minutos + ANTECEDENCIA_MIN : (dataISO < agora.dataISO ? 99999 : -1);
    const out = [];
    regras.forEach(r => {
      let m = hhmmParaMin(r.hora_inicio); const fim = hhmmParaMin(r.hora_fim);
      while (m + dur <= fim) {
        const sobrepoe = ocupados.some(([oi, of_]) => m < of_ && oi < m + dur);
        if (!sobrepoe && m >= minimo) out.push(minParaHHMM(m));
        m += dur + inter;
      }
    });
    return out.sort();
  }

  function desenhar() {
    const agora = agoraBrasilia();
    const dias = [];
    for (let i = 0; i < DIAS_A_FRENTE; i++) {
      const iso = somarDias(agora.dataISO, i);
      if (horariosLivres(iso).length) dias.push(iso);
    }
    if (!dias.length) { el('conteudo').innerHTML = '<div class="vazio">Não há horários disponíveis no momento. Entre em contato para combinarmos.</div>'; return; }
    if (!diaEscolhido || !dias.includes(diaEscolhido)) { diaEscolhido = dias[0]; horaEscolhida = null; }
    const nome = agenda.cliente_nome ? esc(agenda.cliente_nome.split(' ')[0]) : '';
    let h = (nome ? `<div class="sub">Olá, ${nome}! Escolha o dia e o horário do seu atendimento.<br>Horário de Brasília · duração de ${agenda.duracao} min</div>` : `<div class="sub">Horário de Brasília · duração de ${agenda.duracao} min</div>`);
    h += '<div class="titulo-sec">Dia</div><div class="dias">' + dias.map(iso => {
      const d = new Date(iso + 'T12:00:00Z');
      return `<button type="button" class="dia-btn${iso === diaEscolhido ? ' sel' : ''}" data-dia="${iso}"><small>${SEMANA[d.getUTCDay()]}</small>${iso.slice(8)}/${iso.slice(5, 7)}</button>`;
    }).join('') + '</div>';
    h += '<div class="titulo-sec">Horário</div><div class="horas">' + horariosLivres(diaEscolhido).map(hr =>
      `<button type="button" class="hora-btn${hr === horaEscolhida ? ' sel' : ''}" data-hora="${hr}">${hr}</button>`).join('') + '</div>';
    h += `<button type="button" class="btn-submit" id="btnConfirmar" ${horaEscolhida ? '' : 'disabled style="opacity:.5;cursor:default"'}>Confirmar horário</button>`;
    el('conteudo').innerHTML = h;
    el('conteudo').querySelectorAll('.dia-btn').forEach(b => b.onclick = () => { diaEscolhido = b.dataset.dia; horaEscolhida = null; desenhar(); });
    el('conteudo').querySelectorAll('.hora-btn').forEach(b => b.onclick = () => { horaEscolhida = b.dataset.hora; desenhar(); });
    const btn = el('btnConfirmar'); if (btn && horaEscolhida) btn.onclick = confirmar;
  }

  async function confirmar() {
    const btn = el('btnConfirmar'); btn.disabled = true; btn.innerText = 'Confirmando...';
    if (modoTeste) {
      el('conteudo').innerHTML = `<div class="msg-ok"><strong>Teste concluído!</strong><br>Escolheu ${dataBR(diaEscolhido)} às ${horaEscolhida}.<br><br>Nada foi gravado.</div>`;
      return;
    }
    const { data, error } = await supabaseClient.rpc('reservar_horario_agenda', { p_user: ownerId, p_mapa: clienteId, p_data: diaEscolhido, p_hora: horaEscolhida });
    if (error || !data || data.ok !== true) {
      const motivo = data && data.erro ? data.erro : 'Não foi possível confirmar. Tente outro horário.';
      alert(motivo);
      await carregar();
      return;
    }
    el('conteudo').innerHTML = `<div class="msg-ok"><strong>Horário confirmado!</strong><br>${dataBR(diaEscolhido)} às ${horaEscolhida} (horário de Brasília).<br><br>Você pode fechar esta página.</div>`;
  }

  async function carregar() {
    if (!ownerId || !clienteId) { el('conteudo').innerHTML = '<div class="vazio">Link inválido. Volte ao formulário e envie seus dados novamente.</div>'; return; }
    const { data, error } = await supabaseClient.rpc('agenda_publica', { p_user: ownerId, p_mapa: clienteId });
    if (error || !data) { el('conteudo').innerHTML = '<div class="vazio">Link inválido ou expirado. Volte ao formulário e envie seus dados novamente.</div>'; return; }
    agenda = data;
    if (agenda.ja_agendado) {
      el('conteudo').innerHTML = `<div class="msg-ok"><strong>Você já tem um horário marcado.</strong><br>${dataBR(agenda.ja_agendado.data)} às ${agenda.ja_agendado.hora_inicio.slice(0, 5)} (horário de Brasília).</div>`;
      return;
    }
    horaEscolhida = null;
    desenhar();
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const { data: cfg } = await supabaseClient.rpc('config_publica_formulario', { p_user: ownerId });
      const c = Array.isArray(cfg) ? cfg[0] : cfg;
      if (c && c.logo_url) { const i = el('formLogoImg'); i.src = c.logo_url.split('?')[0] + '?t=' + Date.now(); i.style.display = 'block'; }
      if (c && c.formulario_tema === 'ceu') document.body.classList.add('tema-ceu');
    } catch (e) { /* sem logo/tema, segue */ }
    if (modoTeste) el('avisoTeste').style.display = 'block';
    carregar();
  });
</script>
</body>
</html>
